<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dart-Abend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#14282A;--panel:#1C3538;--line:#2C4A4D;--chalk:#F1EFE8;--mute:#8FA8A4;--red:#E4483D;--green:#3DAA74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.4 Karla,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
h1{font-size:2.6rem}
h2{font-size:1.2rem;margin-bottom:10px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:inherit;font-size:1rem;padding:12px;margin-bottom:8px}
button{font:inherit;color:var(--chalk);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}
button:focus-visible,.in:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.main{width:100%;background:var(--green);border-color:var(--green);color:#0c1d1a;font-weight:700;margin-top:6px}
.ghost{background:none}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1}
.seg .on{background:var(--chalk);color:var(--bg);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top button{padding:8px 12px}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0}
.col.act{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.col.won{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:clamp(2.6rem,14vw,4.4rem);line-height:1.1;margin:4px 0}
.last{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.9rem;min-height:1.3em}
.last span{background:var(--bg);border-radius:6px;padding:0 6px}
.last .bust{color:var(--red)}
.hint{text-align:center;min-height:1.6em;margin:12px 0 4px;color:var(--mute)}
.hint b{color:var(--chalk)}
.entry{font-size:2.6rem;text-align:center;border-bottom:2px dashed var(--line);margin:6px 0 10px}
.quick{display:flex;gap:6px;margin-bottom:8px}
.quick button{flex:1;padding:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-family:Oswald,sans-serif;font-size:1.5rem;padding:14px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:400;font-size:.8rem}
.win{text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
@media (prefers-reduced-motion:no-preference){.col{transition:border-color .2s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== HIER DEINE SUPABASE-DATEN EINTRAGEN ======
const SUPABASE_URL = 'https://umgmtbqmlbsuabpsdrrn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kIm1Z2_T4OLLOAS90VO3pg_fGvZLAV4';
// =================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INVALID = new Set([163,166,169,172,173,175,176,178,179]);

let names = ['', ''], start = 501, match = null, channel = null, entry = '';

// Checkout-Weg (Double-Out), größte Würfe zuerst
const D = [];
for (let i = 1; i <= 20; i++) D.push({l:'S'+i,v:i,d:false},{l:'D'+i,v:2*i,d:true},{l:'T'+i,v:3*i,d:false});
D.push({l:'25',v:25,d:false},{l:'Bull',v:50,d:true});
D.sort((a,b) => b.v - a.v);
const FIN = D.filter(x => x.d);
function route(r) {
  if (r > 170 || r < 2) return null;
  for (const f of FIN) if (f.v === r) return [f.l];
  for (const a of D) for (const f of FIN) if (a.v + f.v === r) return [a.l, f.l];
  for (const a of D) for (const b of D) for (const f of FIN) if (a.v + b.v + f.v === r) return [a.l, b.l, f.l];
  return null;
}

function toast(t) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ---------- Ansichten ----------
function home() {
  return `<div class="wrap"><h1>Dart-Abend</h1><p class="mute">Spielstand live auf allen Geräten.</p>
  <div class="card"><h2>Neues Match</h2>
  ${names.map((n,i) => `<input class="in" placeholder="Spieler ${i+1}" value="${esc(n)}" onchange="names[${i}]=this.value">`).join('')}
  ${names.length < 4 ? '<button class="ghost" onclick="addP()">Spieler hinzufügen</button>' : ''}
  <div class="seg"><button class="${start===501?'on':''}" onclick="start=501;render()">501</button><button class="${start===301?'on':''}" onclick="start=301;render()">301</button></div>
  <button class="main" onclick="create()">Match starten</button></div>
  <div class="card"><h2>Match beitreten</h2>
  <input class="in" id="code" placeholder="Code, z. B. K7QM2" maxlength="5" style="text-transform:uppercase">
  <button class="main" onclick="openMatch($('#code').value.trim().toUpperCase())">Beitreten</button></div>
  <button class="ghost" onclick="showStats()">Statistiken ansehen</button></div>`;
}

function col(p, i, st) {
  const v = p.visits, tot = v.reduce((a,x) => a + x.s, 0);
  const avg = v.length ? (tot / v.length).toFixed(1) : '–';
  const last = v.slice(-3).reverse();
  return `<div class="col ${st.turn===i && st.winner===null ? 'act' : ''} ${st.winner===i ? 'won' : ''}">
  <div class="nm">${esc(p.name)}</div><div class="num big">${p.rem}</div>
  <div class="mute">Ø ${avg}</div>
  <div class="last">${last.map(x => `<span class="${x.bust?'bust':''}">${x.bust?'Bust':x.s}</span>`).join('')}</div></div>`;
}

function pad() {
  return `<div class="entry num" id="entry">${entry || '0'}</div>
  <div class="quick">${[26,41,45,60,100,140,180].map(n => `<button onclick="setE(${n})">${n}</button>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="key(${n})">${n}</button>`).join('')}
  <button onclick="undo()" aria-label="Letzte Aufnahme rückgängig">↶</button><button onclick="key(0)">0</button><button onclick="key('x')" aria-label="Löschen">⌫</button></div>
  <button class="main" onclick="submit()">Eintragen</button>`;
}

function matchView() {
  const st = match.state, cur = st.players[st.turn];
  const hint = st.winner === null ? route(cur.rem) : null;
  const w = st.winner !== null ? `<div class="card win"><h2>${esc(st.players[st.winner].name)} gewinnt</h2>
    <button class="main" onclick="rematch()">Revanche</button>
    <button class="ghost" style="margin-top:8px" onclick="undo()">Letzte Aufnahme korrigieren</button></div>` : '';
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button>
  <span class="mute">Code <b style="color:var(--chalk)">${match.id}</b></span><button class="ghost" onclick="share()">Teilen</button></div>
  <div class="board" style="--n:${st.players.length}">${st.players.map((p,i) => col(p,i,st)).join('')}</div>
  ${st.winner !== null ? w : `<div class="hint">${hint ? 'Checkout: <b>' + hint.join(', ') + '</b>' : '&nbsp;'}</div>${pad()}`}</div>`;
}

async function showStats() {
  const { data, error } = await db.from('matches').select('state').eq('finished', true);
  if (error) return toast('Statistiken konnten nicht geladen werden');
  const S = {};
  for (const m of data) m.state.players.forEach((p, i) => {
    const k = p.name.trim().toLowerCase();
    const s = S[k] ??= { n: p.name.trim(), g:0, w:0, pts:0, v:0, h180:0, h140:0, hf:0 };
    s.g++;
    if (m.state.winner === i) { s.w++; s.hf = Math.max(s.hf, p.visits.at(-1).s); }
    for (const x of p.visits) { s.pts += x.s; s.v++; if (x.s === 180) s.h180++; else if (x.s >= 140) s.h140++; }
  });
  const rows = Object.values(S).sort((a,b) => b.w - a.w || b.pts/b.v - a.pts/a.v);
  match = null;
  $('#app').innerHTML = `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button></div><h1>Statistiken</h1>
  <div class="card" style="overflow-x:auto"><table><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Ø</th><th>180</th><th>140+</th><th>Hi-Finish</th></tr>
  ${rows.map(s => `<tr><td>${esc(s.n)}</td><td>${s.g}</td><td>${s.w}</td><td>${s.v ? (s.pts/s.v).toFixed(1) : '–'}</td><td>${s.h180}</td><td>${s.h140}</td><td>${s.hf || '–'}</td></tr>`).join('') || '<tr><td colspan="7" class="mute">Noch keine beendeten Matches.</td></tr>'}
  </table></div><p class="mute">Ø = Punkte pro Aufnahme (3 Darts). Gezählt werden nur beendete Matches.</p></div>`;
}

function render() { $('#app').innerHTML = match ? matchView() : home(); }

// ---------- Aktionen ----------
function addP() { names.push(''); render(); }
function setE(n) { entry = String(n); $('#entry').textContent = entry; }
function key(k) {
  if (k === 'x') entry = entry.slice(0, -1);
  else if (entry.length < 3) entry = (entry + k).replace(/^0+(?=\d)/, '');
  $('#entry').textContent = entry || '0';
}

function code() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:5}, () => c[Math.random() * c.length | 0]).join('');
}

async function create(list = names, s = start) {
  const ps = list.map(n => n.trim()).filter(Boolean);
  if (ps.length < 2) return toast('Mindestens zwei Spieler eintragen');
  const state = { start: s, players: ps.map(name => ({ name, rem: s, visits: [] })), turn: 0, winner: null, log: [] };
  const id = code();
  const { error } = await db.from('matches').insert({ id, state });
  if (error) return toast('Match konnte nicht erstellt werden');
  openMatch(id);
}

async function openMatch(id) {
  const { data, error } = await db.from('matches').select('state').eq('id', id).maybeSingle();
  if (error || !data) return toast('Match nicht gefunden');
  if (channel) db.removeChannel(channel);
  match = { id, state: data.state }; entry = '';
  history.replaceState(null, '', '?m=' + id);
  channel = db.channel('m' + id).on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'matches', filter: 'id=eq.' + id },
    p => { match.state = p.new.state; render(); }).subscribe();
  render();
}

function leave() {
  if (channel) db.removeChannel(channel);
  channel = null; match = null; entry = '';
  history.replaceState(null, '', location.pathname);
  render();
}

async function save() {
  const st = match.state;
  const { error } = await db.from('matches').update({ state: st, finished: st.winner !== null, updated_at: new Date().toISOString() }).eq('id', match.id);
  if (error) toast('Speichern fehlgeschlagen');
}

function submit() {
  const st = match.state;
  if (st.winner !== null) return;
  const s = +entry || 0;
  if (s > 180 || INVALID.has(s)) return toast('Mit drei Darts nicht möglich');
  const p = st.players[st.turn], before = p.rem, after = before - s;
  const bust = after < 0 || after === 1 || (after === 0 && !route(before));
  p.visits.push({ s: bust ? 0 : s, bust, before });
  if (!bust) p.rem = after;
  st.log.push(st.turn);
  if (bust) toast('Bust – die Punkte zählen nicht');
  if (!bust && after === 0) st.winner = st.turn;
  else st.turn = (st.turn + 1) % st.players.length;
  entry = '';
  render(); save();
}

function undo() {
  const st = match.state;
  if (!st.log.length) return toast('Nichts zum Rückgängigmachen');
  const i = st.log.pop(), v = st.players[i].visits.pop();
  st.players[i].rem = v.before; st.turn = i; st.winner = null;
  render(); save();
}

function rematch() {
  const ps = match.state.players.map(p => p.name);
  ps.push(ps.shift()); // Anwurf wechselt
  create(ps, match.state.start);
}

async function share() {
  const url = location.origin + location.pathname + '?m=' + match.id;
  if (navigator.share) { try { await navigator.share({ title: 'Dart-Abend', url }); return; } catch (e) {} }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert'); } catch (e) { toast(url); }
}

// ---------- Start ----------
if (SUPABASE_URL.startsWith('DEINE')) {
  $('#app').innerHTML = '<div class="wrap"><h1>Fast fertig</h1><p>Trage oben in der Datei index.html deine Supabase-URL und den Anon-Key ein.</p></div>';
} else {
  const m = new URLSearchParams(location.search).get('m');
  render();
  if (m) openMatch(m.toUpperCase());
}
</script>
</body>
</html>
