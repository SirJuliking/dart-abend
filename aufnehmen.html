<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stimme aufnehmen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14282A;--panel:#1C3538;--line:#2C4A4D;--chalk:#F1EFE8;--mute:#8FA8A4;--red:#E4483D;--green:#3DAA74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.4 Karla,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
h1{font-size:2rem}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
button,a.btn,select{font:inherit;color:var(--chalk);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;text-decoration:none;display:inline-block}
button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.main{width:100%;background:var(--green);border-color:var(--green);color:#0c1d1a;font-weight:700;margin-top:8px}
.rec{width:100%;background:var(--red);border-color:var(--red);font-weight:700;font-size:1.2rem;padding:18px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;text-align:center}
.big{font-size:3.4rem;line-height:1.1}
.say{font-size:1.4rem;margin-top:6px}
.bar{background:var(--bg);border-radius:6px;height:10px;margin:8px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
select{width:100%;margin-top:8px}
.ok{color:var(--green)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const ones = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const tens = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
const W = n => n < 20 ? ones[n] : n < 100 ? (n % 10 ? (n % 10 === 1 ? 'ein' : ones[n % 10]) + 'und' + tens[n / 10 | 0] : tens[n / 10 | 0]) : 'hundert' + (n % 100 ? W(n % 100) : '');
const BAD = [163,166,169,172,173,175,176,178,179];
const items = [
  ...[1,2,3,4].map(i => ({ k: 'p' + i, say: 'Spieler ' + W(i) })),
  { k: 'single', say: 'Single' }, { k: 'doppel', say: 'Doppel' }, { k: 'triple', say: 'Triple' }, { k: 'bull', say: 'Bull' },
  { k: 'leg_fuer', say: 'Leg für' }, { k: 'satz_fuer', say: 'Satz für' }, { k: 'match', say: 'Spiel, Satz und Match' },
  ...Array.from({ length: 20 }, (_, i) => ({ k: 'n' + (i + 1), num: i + 1, say: W(i + 1) })),
  { k: 'n25', num: 25, say: W(25) },
  ...Array.from({ length: 81 }, (_, i) => 100 + i).filter(n => !BAD.includes(n)).map(n => ({ k: 'n' + n, num: n, say: W(n) + (n === 180 ? '!  (gern mit Schwung)' : '') }))
];
// Zusatz-Modus (aufnehmen.html?zusatz): nur die neuen Ansagen, ergibt sprache2.wav und sprache2.json
const ZUSATZ = location.search.includes('zusatz');
if (ZUSATZ) {
  const NEU = [{ k: 'dart1', say: 'mit dem ersten Dart' }, { k: 'dart2', say: 'mit dem zweiten Dart' }, { k: 'dart3', say: 'mit dem dritten Dart' }, { k: 'bust', say: 'Bust' }];
  items.length = 0; items.push(...NEU);
}
const SUF = ZUSATZ ? '2' : '';
let cur = 0, rec = {}, mr = null, stream = null, chunks = [], recording = false, msgText = '', built = null;

// Zwischenspeicher im Browser, damit nichts verloren geht
const dbp = new Promise((res, rej) => { const r = indexedDB.open('darts-rec' + (ZUSATZ ? '-zusatz' : ''), 1); r.onupgradeneeded = () => r.result.createObjectStore('c'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idb = async (mode, fn) => { const d = await dbp; return new Promise((res, rej) => { const tx = d.transaction('c', mode), rq = fn(tx.objectStore('c')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); }); };
async function restore() {
  try {
    const keys = await idb('readonly', s => s.getAllKeys());
    for (const k of keys) rec[k] = await idb('readonly', s => s.get(k));
    cur = Math.max(0, items.findIndex(it => !rec[it.k]));
  } catch (e) {}
  render();
}

function render() {
  const it = items[cur], n = Object.keys(rec).length;
  document.getElementById('app').innerHTML = `<h1>Stimme aufnehmen${ZUSATZ ? ' (Zusatz)' : ''}</h1>
  <p class="mute">${ZUSATZ ? 'Nur die neuen Ansagen. Nimm sie mit demselben Mikrofon und im selben Raum auf wie das Hauptpaket. ' : ''}Sprich jeden Begriff einzeln ein. Stille am Anfang und Ende wird automatisch entfernt.</p>
  <div class="bar"><i style="width:${n / items.length * 100}%"></i></div>
  <div class="mute">Aufgenommen: ${n} von ${items.length}</div>
  <div class="card"><div class="mute">${cur + 1} von ${items.length}</div>
  ${it.num ? `<div class="num big">${it.num}</div>` : ''}
  <div class="say">Sag: <b>„${it.say}“</b></div>
  ${rec[it.k] ? '<div class="ok">✓ aufgenommen</div>' : '<div class="mute">noch nicht aufgenommen</div>'}
  <button class="rec" onclick="toggleRec()">${recording ? '■ Stopp' : '● Aufnehmen'}</button>
  <div class="row"><button onclick="play()" ${rec[it.k] ? '' : 'disabled'}>Anhören</button>
  <button onclick="go(-1)">‹ Zurück</button><button onclick="go(1)">Weiter ›</button></div></div>
  <select aria-label="Springe zu" onchange="cur=+this.value;render()">${items.map((x, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${rec[x.k] ? '✓ ' : ''}${x.num || ''} ${x.say}</option>`).join('')}</select>
  <p class="mute">${msgText}</p>
  <button class="main" onclick="build()">Sprachpaket erstellen</button>
  ${built ? `<div class="card"><p>Fertig. Lade beide Dateien herunter und lege sie in dein GitHub-Repository.</p>
  <a class="btn main" href="${built.wav}" download="sprache${SUF}.wav">sprache${SUF}.wav herunterladen</a>
  <a class="btn main" href="${built.json}" download="sprache${SUF}.json">sprache${SUF}.json herunterladen</a></div>` : ''}`;
}
function go(d) { cur = Math.min(items.length - 1, Math.max(0, cur + d)); render(); }
function play() { const a = new Audio(URL.createObjectURL(rec[items[cur].k])); a.play(); }
async function toggleRec() {
  if (mr && mr.state === 'recording') { mr.stop(); return; }
  try { stream = stream || await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { msgText = 'Mikrofon nicht erlaubt.'; return render(); }
  chunks = []; mr = new MediaRecorder(stream);
  const k = items[cur].k;
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = async () => {
    recording = false;
    const b = new Blob(chunks, { type: mr.mimeType }); rec[k] = b;
    try { await idb('readwrite', s => s.put(b, k)); } catch (e) {}
    render();
  };
  mr.start(); recording = true; render();
}
function wav(f, sr) {
  const b = new ArrayBuffer(44 + f.length * 2), v = new DataView(b), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + f.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, f.length * 2, true);
  for (let i = 0; i < f.length; i++) { const x = Math.max(-1, Math.min(1, f[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true); }
  return new Blob([b], { type: 'audio/wav' });
}
async function build() {
  if (!Object.keys(rec).length) { msgText = 'Nimm zuerst mindestens einen Begriff auf.'; return render(); }
  msgText = 'Wird erstellt, bitte kurz warten …'; render();
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const SR = 24000, gap = Math.round(SR * 0.08), parts = [], idx = {}; let pos = 0;
    for (const it of items) {
      const b = rec[it.k]; if (!b) continue;
      const buf = await ctx.decodeAudioData(await b.arrayBuffer());
      const oc = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration * SR)), SR);
      const s = oc.createBufferSource(); s.buffer = buf; s.connect(oc.destination); s.start();
      const d = (await oc.startRendering()).getChannelData(0);
      let pk = 0; for (let i = 0; i < d.length; i++) pk = Math.max(pk, Math.abs(d[i]));
      if (pk < 0.005) continue;
      const thr = Math.max(0.01, pk * 0.05); let a = 0, z = d.length - 1;
      while (a < z && Math.abs(d[a]) < thr) a++;
      while (z > a && Math.abs(d[z]) < thr) z--;
      a = Math.max(0, a - Math.round(SR * 0.03)); z = Math.min(d.length, z + Math.round(SR * 0.12));
      const g = Math.min(8, 0.9 / pk), out = new Float32Array(z - a + gap);
      for (let i = a; i < z; i++) out[i - a] = d[i] * g;
      idx[it.k] = { s: +(pos / SR).toFixed(3), e: +((pos + z - a) / SR).toFixed(3) };
      parts.push(out); pos += out.length;
    }
    const all = new Float32Array(pos); let o = 0; parts.forEach(p => { all.set(p, o); o += p.length; });
    built = { wav: URL.createObjectURL(wav(all, SR)), json: URL.createObjectURL(new Blob([JSON.stringify(idx)], { type: 'application/json' })) };
    msgText = `${Object.keys(idx).length} Aufnahmen im Paket.`;
  } catch (e) { msgText = 'Das hat nicht geklappt: ' + e.message; }
  render();
}
restore();
</script>
</body>
</html>
