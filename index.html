<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dart-Abend</title>
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#14282A;--panel:#1C3538;--line:#2C4A4D;--chalk:#F1EFE8;--mute:#8FA8A4;--red:#E4483D;--green:#3DAA74}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.4 Karla,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
h1{font-size:2.6rem}h2{font-size:1.2rem;margin-bottom:10px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:inherit;padding:12px;margin-bottom:8px}
button{font:inherit;color:var(--chalk);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}
button:focus-visible,.in:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.main{width:100%;background:var(--green);border-color:var(--green);color:#0c1d1a;font-weight:700;margin-top:6px}
.ghost{background:none}
.seg{display:flex;gap:8px;margin:8px 0}.seg>*{flex:1}
.seg .on{background:var(--chalk);color:var(--bg);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.top button{padding:8px 10px}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;min-width:0}
.col.act{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.col.won{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1.1;margin:4px 0}
.sm{font-size:.85rem}
.last{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;min-height:1.4em}
.last span{background:var(--bg);border-radius:6px;padding:0 6px}
.last .bust{color:var(--red)}
.hint{text-align:center;min-height:1.6em;margin:12px 0 4px;color:var(--mute)}.hint b{color:var(--chalk)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.r4{grid-template-columns:repeat(4,1fr)}
.nums button{font-family:Oswald,sans-serif;font-size:1.3rem;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{color:var(--mute);font-weight:400;font-size:.8rem}
.win{text-align:center}
.crow{display:grid;grid-template-columns:90px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
.bar{background:var(--bg);border-radius:6px;height:22px}.bar i{display:block;height:100%;background:var(--green);border-radius:6px;min-width:2px}
#camBox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:560px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{position:relative}.tile.big{grid-column:1/-1}
.tile span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:0 8px;border-radius:6px;font-size:.8rem}
.tile video{width:100%;height:15vh;object-fit:cover;border-radius:14px;background:#000;display:block;cursor:pointer}
.tile.me video{touch-action:none}
.tile.big video{height:42vh}
.tile input{position:absolute;right:8px;bottom:6px;width:48%}
@media (min-width:900px){.tile video{height:26vh}.tile.big video{height:50vh}}
.chw{position:relative}.tip{position:absolute;transform:translate(-50%,-135%);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:.8rem;white-space:nowrap;pointer-events:none;z-index:3}.pt{cursor:pointer}.pt:hover .dot2{r:5.5}
.chbtn{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;width:50px;height:50px;border-radius:50%;padding:0;font-size:1.35rem;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.45)}
.chbtn i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 .75rem/20px sans-serif;font-style:normal;padding:0 5px}
.chp{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.5)}
.chl{overflow:auto;height:38vh;display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:2px}
.chm{background:var(--bg);border-radius:10px;padding:6px 10px;align-self:flex-start;max-width:85%;overflow-wrap:anywhere}
.chm.me{align-self:flex-end;background:#1f4a42}.chm b{display:block;font-size:.72rem;color:var(--mute)}
.chrow{display:flex;gap:8px}.chrow .in{margin:0;flex:1;min-width:0}
.lbl{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:600}
.pn{flex:none;width:30px;height:30px;margin-top:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.px{flex:none;width:36px;padding:0;margin-bottom:8px;color:var(--mute)}
.addp{width:100%;border-style:dashed;background:none;margin:0 0 14px;color:var(--mute)}
.fl{display:block;font-size:.85rem;color:var(--mute);margin:6px 0 4px}
.prow{display:grid;grid-template-columns:30px 1fr 120px 36px;gap:8px}.prow input,.prow select{min-width:0}.prow select{padding-left:8px;padding-right:4px}.prow select.w2{grid-column:span 2}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.panel h3{margin:16px 0 2px;font-family:Oswald,sans-serif;color:var(--mute);font-weight:500;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.sgrp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 12px 12px;margin:10px 0}.sgrp .srow:last-of-type{border-bottom:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.srow input[type=range]{width:55%;accent-color:var(--green)}
.srow select{padding:8px;font:inherit;color:var(--chalk);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.th{background:none;border:0;padding:4px 2px;color:var(--mute);font-size:.8rem;border-radius:6px}
.th.on{color:var(--chalk);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
td.bst{color:var(--green);font-weight:700}
.et th:nth-child(n+2),.et td:nth-child(n+2){text-align:right}
.cust{margin:0;text-align:center}.cust.on{border-color:var(--chalk);border-width:2px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.ht{display:flex;flex-direction:column;justify-content:flex-start;gap:14px;min-height:150px;text-align:left;padding:16px;border-radius:16px}
.ht .ic{font-size:2.1rem;line-height:1}.ht b{font-family:Oswald,Impact,sans-serif;font-size:1.6rem;display:block}.ht span.s{font-size:.85rem;opacity:.8}
.ht.g{background:var(--green);border-color:var(--green);color:#0c1d1a}.ht.r{background:var(--red);border-color:var(--red);color:#fff}
details summary{cursor:pointer;color:var(--mute);margin:6px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:Oswald,sans-serif;font-size:1.3rem;font-weight:700}
.lnk{background:none;border:0;color:var(--chalk);padding:0;font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stack{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:6px 0}.stack i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{padding:6px 12px;border-radius:999px;font-size:.9rem}
.chip.on{background:var(--chalk);color:var(--bg);font-weight:700}
.brow{display:grid;grid-template-columns:62px 1fr 74px;gap:8px;align-items:center;margin:5px 0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
</style>
</head>
<body>
<div id="camBox" hidden></div>
<div id="app"></div>
<div id="chatRoot"></div>
<script>
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let names = ['', ''], outs = ['double', 'double'], watch = false, vtab = 'throws', psec = '', showPc = false, shareOpen = false, start = 501, legsW = 3, setsW = 1, match = null, channel = null, mult = 1;

// ---------- Checkout-Weg (Double-Out) ----------
const D = [];
for (let i = 1; i <= 20; i++) D.push({l:'S'+i,v:i,d:0},{l:'D'+i,v:2*i,d:1},{l:'T'+i,v:3*i,d:0});
D.push({l:'25',v:25,d:0},{l:'Bull',v:50,d:1});
D.sort((a,b) => b.v - a.v);
const FIN = D.filter(x => x.d);
// Übliche Checkout-Tabelle für Double Out (Wege wie auf gängigen Checkout-Karten): erst hohe Triples, am Ende ein gut treffbares Doppel
const CHT = `170 T20 T20 Bull|167 T20 T19 Bull|164 T20 T18 Bull|161 T20 T17 Bull|160 T20 T20 D20|158 T20 T20 D19|157 T20 T19 D20|156 T20 T20 D18|155 T20 T19 D19|154 T20 T18 D20|153 T20 T19 D18|152 T20 T20 D16|151 T20 T17 D20|150 T20 T18 D18|149 T20 T19 D16|148 T20 T16 D20|147 T20 T17 D18|146 T20 T18 D16|145 T20 T15 D20|144 T20 T20 D12|143 T20 T17 D16|142 T20 T14 D20|141 T20 T19 D12|140 T20 T20 D10|139 T20 T13 D20|138 T20 T18 D12|137 T20 T19 D10|136 T20 T20 D8|135 T20 T17 D12|134 T20 T14 D16|133 T20 T19 D8|132 T20 T16 D12|131 T20 T13 D16|130 T20 T18 D8|129 T19 T16 D12|128 T18 T14 D16|127 T20 T17 D8|126 T19 T19 D6|125 25 T20 D20|124 T20 T16 D8|123 T19 T16 D9|122 T18 T18 D7|121 T20 T11 D14|120 T20 S20 D20|119 T19 S12 Bull|118 T20 S18 D20|117 T20 S17 D20|116 T20 S16 D20|115 T20 S15 D20|114 T20 S14 D20|113 T19 S16 D20|112 T20 S12 D20|111 T20 S11 D20|110 T20 Bull|109 T19 S12 D20|108 T20 S16 D16|107 T19 Bull|106 T20 S6 D20|105 T20 S13 D16|104 T18 Bull|103 T19 S6 D20|102 T20 S10 D16|101 T17 Bull|100 T20 D20|99 T19 S10 D16|98 T20 D19|97 T19 D20|96 T20 D18|95 T19 D19|94 T18 D20|93 T19 D18|92 T20 D16|91 T17 D20|90 T20 D15|89 T19 D16|88 T20 D14|87 T17 D18|86 T18 D16|85 T15 D20|84 T20 D12|83 T17 D16|82 Bull D16|81 T19 D12|80 T20 D10|79 T13 D20|78 T18 D12|77 T19 D10|76 T20 D8|75 T17 D12|74 T14 D16|73 T19 D8|72 T16 D12|71 T13 D16|70 T18 D8|69 T19 D6|68 T20 D4|67 T17 D8|66 T10 D18|65 25 D20|64 T16 D8|63 T13 D12|62 T10 D16|61 T15 D8|60 S20 D20|59 S19 D20|58 S18 D20|57 S17 D20|56 T16 D4|55 S15 D20|54 S14 D20|53 S13 D20|52 S12 D20|51 S19 D16|50 Bull|49 S9 D20|48 S16 D16|47 S15 D16|46 S6 D20|45 S13 D16|44 S4 D20|43 S3 D20|42 S10 D16|41 S9 D16`;
const CH = {};
CHT.split('|').forEach(e => { const [r, ...w] = e.split(' '); CH[+r] = w; });
// Beliebteste Doppel (bester zuerst): bei den kleinen Resten wird auf das beste erreichbare Doppel gespielt
const DR = [20, 16, 10, 8, 12, 18, 4, 6, 14, 2, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1];
const DRANK = l => l === 'Bull' ? 99 : DR.indexOf(+l.slice(1));
function route(r, max = 3, rule = 'double') {
  if (rule === 'double') {
    if (r < 2 || r > 170) return null;
    if (CH[r] && CH[r].length <= max) return CH[r];
    if (r <= 40 && max >= 1) {
      if (r % 2 === 0) return ['D' + r / 2];
      if (max >= 2) { // ungerade Reste: erst ein Single auf das beste erreichbare Doppel
        let best = null;
        for (const f of FIN) if (f.v < r && f.l !== 'Bull') { const a = D.find(x => x.v === r - f.v && x.l[0] === 'S'); if (a && (!best || DRANK(f.l) < DRANK(best[1]))) best = [a.l, f.l]; }
        if (best) return best;
      }
    }
  }
  return routeAny(r, max, rule);
}
function routeAny(r, max = 3, rule = 'double') {
  const single = rule === 'single';
  if (r > (single ? 180 : 170) || r < (single ? 1 : 2)) return null;
  const F = single ? D : rule === 'master' ? D.filter(x => x.d || x.l[0] === 'T') : FIN;
  for (const f of F) if (f.v === r) return [f.l];
  if (max >= 2) for (const a of D) for (const f of F) if (a.v + f.v === r) return [a.l, f.l];
  if (max >= 3) for (const a of D) for (const b of D) for (const f of F) if (a.v + b.v + f.v === r) return [a.l, b.l, f.l];
  return null;
}
const RL = { single: 'Single Out', double: 'Double Out', master: 'Master Out' };
const lbl = ([m, x]) => !m ? '0' : (m === 2 && x === 25 ? 'Bull' : (m === 1 ? '' : m === 2 ? 'D' : 'T') + x);

// ---------- Spiellogik: Zustand wird aus der Wurfliste berechnet ----------
function calc(cfg, ev) {
  const n = cfg.players.length;
  const P = cfg.players.map((name, i) => ({ name, rule: (cfg.outs || [])[i] || 'double', rem: cfg.start, legs: 0, sets: 0, v: [] }));
  let leg = 0, starter = 0, turn = 0, cur = null, winner = null;
  for (let ei = 0; ei < ev.length; ei++) {
    const [m, x] = ev[ei];
    if (winner !== null) break;
    const p = P[turn];
    if (!cur) cur = { before: p.rem, d: [], sum: 0, leg };
    cur.d.push([m, x]); cur.sum += m * x; cur.n = ei;
    const after = cur.before - cur.sum;
    const okFin = p.rule === 'single' || (p.rule === 'master' ? m >= 2 : m === 2);
    if (after < 0 || (after === 1 && p.rule !== 'single') || (after === 0 && !okFin)) {
      cur.bust = true; cur.sum = 0; p.rem = cur.before; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else if (after === 0) {
      cur.win = true; p.v.push(cur); cur = null; p.legs++;
      if (p.legs >= cfg.legs) { p.sets++; P.forEach(q => q.legs = 0); if (p.sets >= cfg.sets) winner = turn; }
      if (winner === null) { leg++; P.forEach(q => q.rem = cfg.start); starter = (starter + 1) % n; turn = starter; } else p.rem = 0;
    } else if (cur.d.length === 3) {
      p.rem = after; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else p.rem = after;
  }
  return { P, turn, cur, winner };
}
const nVis = c => c.P.reduce((a, p) => a + p.v.length, 0);

// ---------- Ansichten ----------
const custIn = (v, vn) => `<input class="in cust ${v !== 301 && v !== 501 ? 'on' : ''}" type="number" inputmode="numeric" min="2" max="1501" placeholder="Eigene" aria-label="Eigene Startzahl" value="${v !== 301 && v !== 501 ? v : ''}" onchange="setCust('${vn}', this.value)">`;
function setCust(vn, v) {
  const n = parseInt(v, 10);
  if (!(n >= 2 && n <= 1501)) { toast('Bitte eine Zahl von 2 bis 1501 eingeben'); return render(); }
  if (vn === 'start') start = n; else tstart = n;
  render();
}
function delP(i) { if (names.length <= 2) return; names.splice(i, 1); outs.splice(i, 1); render(); }
function newView() {
  const opt = (arr, cur, f) => arr.map(n => `<option value="${n}" ${cur === n ? 'selected' : ''}>${f(n)}</option>`).join('');
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="nav('home')">‹ Start</button><button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></div><h1>Neues Match</h1>
  <div class="card"><div class="lbl">Spieler</div>
  ${names.map((n, i) => `<div class="prow"><span class="pn">${i + 1}</span><input class="in" placeholder="Name" aria-label="Spieler ${i + 1}" value="${esc(n)}" onchange="names[${i}]=this.value"><select class="in ${i >= 2 ? '' : 'w2'}" aria-label="Check-out-Regel" onchange="outs[${i}]=this.value">${[['double','Double Out'],['master','Master Out'],['single','Single Out']].map(([v, l]) => `<option value="${v}" ${outs[i] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${i >= 2 ? `<button class="ghost px" aria-label="Spieler ${i + 1} entfernen" onclick="delP(${i})">✕</button>` : ''}</div>`).join('')}
  ${names.length < 4 ? '<button class="ghost addp" onclick="addP()">+ Spieler hinzufügen</button>' : ''}
  ${chips()}
  </div>
  <div class="card"><div class="lbl">Spiel</div>
  <div class="seg" style="margin-top:0"><button class="${start===301?'on':''}" onclick="start=301;render()">301</button><button class="${start===501?'on':''}" onclick="start=501;render()">501</button>${custIn(start, 'start')}</div>
  <label class="fl">Legs pro Satz</label><select class="in" onchange="legsW=+this.value">${opt([1,2,3,4,5], legsW, n => n + (n > 1 ? ' Legs' : ' Leg'))}</select>
  <label class="fl">Sätze zum Sieg</label><select class="in" onchange="setsW=+this.value">${opt([1,2,3,4,5], setsW, n => n + (n > 1 ? ' Sätze' : ' Satz'))}</select></div>
  <button class="main" style="padding:16px;font-size:1.1rem" onclick="create()">Match starten</button>
  </div>`;
}

function home() {
  return `<div class="wrap"><h1>Dart-Abend</h1><p class="mute">Spielstand live auf allen Geräten.</p>
  <div class="tiles">
  <button class="ht g" onclick="nav('new')"><span class="ic">🎯</span><span><b>Match</b><span class="s">Neues Spiel gegen Freunde</span></span></button>
  <button class="ht r" onclick="nav('tsetup')"><span class="ic">🏋️</span><span><b>Training</b><span class="s">Alleine üben</span></span></button>
  <button class="ht" onclick="nav('join')"><span class="ic">🔑</span><span><b>Beitreten</b><span class="s">Mit Code zuschauen oder mitspielen</span></span></button>
  <button class="ht" onclick="showStats()"><span class="ic">📊</span><span><b>Ranking</b><span class="s">Statistiken und Profile</span></span></button>
  </div>
  <button class="ghost" style="width:100%" onclick="toggleSet()">⚙ Einstellungen</button></div>`;
}
function joinView() {
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="nav('home')">‹ Start</button><button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></div><h1>Beitreten</h1>
  <div class="card"><input class="in" id="code" placeholder="Code eingeben" maxlength="14" autocapitalize="characters" style="text-transform:uppercase">
  <p class="mute sm" style="margin:0 0 8px">Mit dem Zahlen-Code (3 Ziffern) schaust du zu. Mit dem Buchstaben-Code kannst du mitspielen und eintragen.</p>
  <button class="main" onclick="joinCode()">Beitreten</button></div>
  <div class="lbl" style="margin:18px 2px 8px">Laufende Matches</div><div id="live">${liveHtml()}</div></div>`;
}
let LIVE = null;
function liveHtml() {
  if (LIVE === null) return '<p class="mute sm">Lade …</p>';

function col(p, i, c) {
  const act = c.turn === i && c.winner === null;
  const pts = p.v.reduce((a, v) => a + v.sum, 0), dr = p.v.reduce((a, v) => a + v.d.length, 0);
  const shown = act && c.cur ? c.cur.d.map(lbl) : (p.v.length ? p.v.at(-1).d.map(lbl) : []);
  const bust = !act && p.v.length && p.v.at(-1).bust;
  return `<div class="col ${act ? 'act' : ''} ${c.winner === i ? 'won' : ''}">
  <div class="nm">${esc(p.name)}</div><div class="mute sm">${RL[p.rule]}</div><div class="num big">${p.rem}</div>
  <div class="mute sm">Sätze ${p.sets} / Legs ${p.legs}</div><div class="mute sm">Ø ${dr ? (pts / dr * 3).toFixed(1) : '–'}</div>
  <div class="last">${shown.map(x => `<span class="${bust ? 'bust' : ''}">${x}</span>`).join('')}</div></div>`;
}

}

// ---------- Statistiken ----------
function agg(rows) {
  const A = {}; let gi = 0;
  for (const r of rows) {
    if (!r.state.cfg) continue;
    gi++;
    const c = r.c ??= calc(r.state.cfg, r.state.ev);
    c.P.forEach((p, i) => {
      const k = p.name.trim().toLowerCase();
      const s = A[k] ??= { n: p.name.trim(), g: 0, w: 0, pts: 0, dr: 0, f9: 0, f9d: 0, h180: 0, h140: 0, hf: 0, ch: 0, co: 0, av: [] };
      s.g++; if (c.winner === i) s.w++;
      let pts = 0, dr = 0; const seen = {};
      for (const v of p.v) {
        pts += v.sum; dr += v.d.length;
        if (v.sum === 180) s.h180++; else if (v.sum >= 140) s.h140++;
        seen[v.leg] = (seen[v.leg] || 0) + 1;
        if (seen[v.leg] <= 3) { s.f9 += v.sum; s.f9d += v.d.length; }
        if (route(v.before, 3, p.rule)) { s.ch++; if (v.win) { s.co++; s.hf = Math.max(s.hf, v.sum); } }
      }
      s.pts += pts; s.dr += dr; s.av.push([gi, dr ? pts / dr * 3 : 0]);
    });
  }
  return { list: Object.values(A), total: gi };
}

// Werte eines beendeten Matches (für den Endscreen)
function mstats(c) {
  return c.P.map(p => {
    const m = { hi: 0, avg: 0, f9: 0, h180: 0, h140: 0, h100: 0, hf: 0, ch: 0, co: 0, best: 0, darts: 0, legs: 0 };
    let pts = 0, f9 = 0, f9d = 0; const seen = {}, ld = {};
    for (const v of p.v) {
      m.hi = Math.max(m.hi, v.sum); m.darts += v.d.length; pts += v.sum; ld[v.leg] = (ld[v.leg] || 0) + v.d.length;
      if (v.sum === 180) m.h180++; else if (v.sum >= 140) m.h140++; else if (v.sum >= 100) m.h100++;
      seen[v.leg] = (seen[v.leg] || 0) + 1; if (seen[v.leg] <= 3) { f9 += v.sum; f9d += v.d.length; }
      if (route(v.before, 3, p.rule)) m.ch++;
      if (v.win) { m.co++; m.legs++; m.hf = Math.max(m.hf, v.sum); m.best = m.best ? Math.min(m.best, ld[v.leg]) : ld[v.leg]; }
    }
    m.avg = m.darts ? pts / m.darts * 3 : 0; m.f9 = f9d ? f9 / f9d * 3 : 0;
    return m;
  });
}
function endView(c) {
  const M = mstats(c), cfg = match.st.cfg, legs = M.map(m => m.legs).join(' : ');
  const rows = [
    ['Average', m => m.avg, m => m.avg.toFixed(1), 1], ['First 9', m => m.f9, m => m.f9.toFixed(1), 1],
    ['180er', m => m.h180, m => m.h180, 1], ['140+', m => m.h140, m => m.h140, 1], ['100+', m => m.h100, m => m.h100, 1],
    ['Höchstes Finish', m => m.hf, m => m.hf || '–', 1],
    ['Checkout-Quote', m => m.ch ? m.co / m.ch : 0, m => m.ch ? Math.round(m.co / m.ch * 100) + '% (' + m.co + '/' + m.ch + ')' : '–', 1],
    ['Schnellstes Leg', m => m.best || 999, m => m.best ? m.best + ' Darts' : '–', -1],
    ['Darts gesamt', m => m.darts, m => m.darts, 0]
  ];
  const tr = rows.map(([l, g, f, dir]) => {
    const vals = M.map(g), top = dir === 1 ? Math.max(...vals) : Math.min(...vals);
    const mark = dir !== 0 && new Set(vals).size > 1 && (dir === 1 ? top > 0 : top < 999);
    return `<tr><td>${l}</td>${M.map((m, i) => `<td class="${mark && vals[i] === top ? 'bst' : ''}">${f(m)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="card win"><div class="mute sm">Spiel beendet</div><h2 style="font-size:1.9rem">${esc(c.P[c.winner].name)} gewinnt</h2>
  <div class="num" style="font-size:2.8rem">${cfg.sets > 1 ? c.P.map(p => p.sets).join(' : ') : legs}</div>
  <div class="mute sm">${cfg.sets > 1 ? 'Sätze, Legs insgesamt ' + legs : 'Legs'}</div>
  <div style="overflow-x:auto;margin-top:12px"><table class="et"><tr><th></th>${c.P.map(p => `<th style="max-width:90px;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</th>`).join('')}</tr>${tr}</table></div>
  ${throwLog(c)}
  ${clipWin()}
  ${watch ? '' : '<button class="main" onclick="rematch()">Revanche</button><button class="ghost" style="width:100%;margin-top:8px" onclick="undo()">Letzten Dart korrigieren</button>'}
  <button class="ghost" style="width:100%;margin-top:8px" onclick="showStats()">Zum Ranking</button></div>`;
}

let sk = 'q', sd = -1;
const COLS = [
  ['n', 'Spieler', s => s.n.toLowerCase(), null],
  ['g', 'Spiele', s => s.g, s => s.g],
  ['w', 'Siege', s => s.w, s => s.w],
  ['q', 'Quote', s => s.g ? s.w / s.g : 0, s => pc0(s.w, s.g)],
  ['avg', 'Ø', s => s.dr ? s.pts / s.dr : 0, s => s.dr ? (s.pts / s.dr * 3).toFixed(1) : '–'],
  ['f9', 'First 9', s => s.f9d ? s.f9 / s.f9d : 0, s => s.f9d ? (s.f9 / s.f9d * 3).toFixed(1) : '–'],
  ['h180', '180', s => s.h180, s => s.h180],
  ['h140', '140+', s => s.h140, s => s.h140],
  ['hf', 'Hi-Finish', s => s.hf, s => s.hf || '–'],
  ['co', 'Checkout', s => s.ch ? s.co / s.ch : 0, s => pc0(s.co, s.ch)]
];
function setSort(k) { if (sk === k) sd = -sd; else { sk = k; sd = k === 'n' ? 1 : -1; } render(); }
function chart(list, total, color) {
  const lo = Math.max(1, total - 19);
  const pl = list.map(s => ({ s, pts: s.av.filter(a => a[0] >= lo) })).filter(x => x.pts.length);
  const all = pl.flatMap(x => x.pts.map(a => a[1]));
  if (all.length < 2) return '<p class="mute">Noch zu wenig Daten für den Verlauf.</p>';
  const y0 = Math.max(0, Math.floor(Math.min(...all) / 10) * 10), y1 = Math.max(y0 + 10, Math.ceil(Math.max(...all) / 10) * 10);
  const W = 360, H = 220, L = 34, R = 12, T = 12, B = 26;
  const X = g => (L + (total === lo ? 0.5 : (g - lo) / (total - lo)) * (W - L - R)).toFixed(1);
  const Y = v => (T + (y1 - v) / (y1 - y0) * (H - T - B)).toFixed(1);
  const grid = [0, 1, 2, 3, 4].map(k => { const v = y0 + k * (y1 - y0) / 4; return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${+Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--mute)">${Math.round(v)}</text>`; }).join('');
  const lines = pl.map(({ s, pts }) => { const c = color(s); return `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(a => X(a[0]) + ',' + Y(a[1])).join(' ')}"/>` + pts.map(a => `<g class="pt" data-t="<b>${esc(s.n)}</b> Ø ${a[1].toFixed(1)} · Match ${a[0]}" data-x="${(X(a[0]) / W * 100).toFixed(1)}" data-y="${(Y(a[1]) / H * 100).toFixed(1)}" onmouseenter="tip(this)" onclick="tip(this)" onmouseleave="tipOff(this)"><circle cx="${X(a[0])}" cy="${Y(a[1])}" r="12" fill="transparent"/><circle class="dot2" cx="${X(a[0])}" cy="${Y(a[1])}" r="3.5" fill="${c}" stroke="var(--panel)" stroke-width="1.5"/></g>`).join(''); }).join('');
  return `<div class="chw"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average-Verlauf der Spieler">${grid}${lines}<text x="${L}" y="${H - 6}" font-size="10" fill="var(--mute)">älter</text><text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--mute)">neuestes Match</text></svg><div class="tip" hidden></div></div><p class="mute sm" style="margin:4px 0 0">Punkt antippen oder mit der Maus darüberfahren: Average des Matches.</p>`;
}

function trainRun() {
  const s = TS, c = tcalc(s), done = c.done, st = tstat(s);
  const top = `<div class="top"><button class="ghost" onclick="trainLeave()">‹ Zurück</button><span class="mute">Training: ${TK[s.kind]}</span><span><button class="ghost" onclick="toggleCam()">${stream ? 'Kamera aus' : 'Kamera'}</button> <button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></span></div>`;
  const chipsOf = a => `<div class="last">${a.map(x => `<span>${x}</span>`).join('')}</div>`;
  const hintOf = (r, left) => { const h = !done && S.chk ? route(r, left, s.rule) : null; return `<div class="hint">${h ? 'Checkout: <b>' + h.join(', ') + '</b>' : '&nbsp;'}</div>`; };
  const end = !done && s.ev.length ? `<button class="ghost" style="width:100%;margin-top:10px" onclick="trainEnd()">Training beenden</button>` : '';
  const cd = c.cur ? c.cur.d.map(lbl) : [];
  let body = '';
  if (s.kind === 'fin') {
    const r = c.cur ? c.cur.rem : s.rs[c.vis.length], left = 3 - (c.cur ? c.cur.d.length : 0);
    body = `<div class="card win"><div class="mute sm">Versuch ${c.vis.length + (done ? 0 : 1)}${s.o.n ? ' von ' + s.o.n : ''}, geschafft: ${st.ok} von ${st.att} (${pc0(st.ok, st.att)})</div>
    ${done ? '' : `<div class="num big">${r}</div><div class="mute sm">${c.cur && c.cur.r !== r ? 'Start-Rest ' + c.cur.r + ', ' : ''}${RL[s.rule]}</div>${chipsOf(cd)}`}</div>
    ${done ? '' : hintOf(r, left)}
    ${chipsOf(c.vis.slice(-8).reverse().map(v => `${v.r} ${v.ok ? '✓' : '✗'}`))}`;
  } else if (s.kind === 'sc' || s.kind === 'fld') {
    const vn = c.vis.length + (done ? 0 : 1);
    if (s.kind === 'sc') {
      const g = s.o.goal, diff = st.darts ? st.avg - g : 0;
      body = `<div class="card win"><div class="mute sm">Aufnahme ${vn}${s.o.n ? ' von ' + s.o.n : ''}</div>
      <div class="num big">${st.darts ? st.avg.toFixed(1) : '–'}</div><div class="mute sm">Average${g ? ', Ziel ' + g + (st.darts ? ' (' + (diff >= 0 ? '+' : '') + diff.toFixed(1) + ')' : '') : ''}</div>
      ${chipsOf(cd)}<div class="mute sm" style="margin-top:6px">100+: ${st.h100} · 140+: ${st.h140} · 180: ${st.h180}${c.vis.length ? ' · Letzte: ' + c.vis.at(-1).sum : ''}</div></div>`;
    } else {
      body = `<div class="card win"><div class="mute sm">Aufnahme ${vn}${s.o.n ? ' von ' + s.o.n : ''}, Ziel: ${s.o.field}</div>
      <div class="num big">${st.hits}</div><div class="mute sm">Treffer bei ${st.darts} Darts (${pc0(st.hits, st.darts)})</div>
      ${chipsOf(cd.map((x, i) => { const e = c.cur.d[i], t = tparse(s.o.field); return (e[0] === t[0] && e[1] === t[1] ? '✓ ' : '') + x; }))}
      <div class="mute sm" style="margin-top:6px">Aufnahmen mit 0 / 1 / 2 / 3 Treffern: ${st.hv.join(' / ')}</div></div>`;
    }
  } else {
    const P = c.c.P[0], left = 3 - (c.c.cur ? c.c.cur.d.length : 0), lg = c.c.winner !== null ? P.legs : P.legs + 1;
    const ld = P.v.filter(v => v.leg === (c.c.cur ? c.c.cur.leg : P.v.length ? P.v.at(-1).leg + (P.v.at(-1).win ? 1 : 0) : 0)).reduce((a, v) => a + v.d.length, 0) + (c.c.cur ? c.c.cur.d.length : 0);
    body = `<div class="card win"><div class="mute sm">Leg ${Math.min(lg, s.cfg.legs)} von ${s.cfg.legs}, ${RL[s.rule]}</div>
    <div class="num big">${P.rem}</div><div class="mute sm">Darts in diesem Leg: ${ld} · Ø ${st.darts ? st.avg.toFixed(1) : '–'}${st.legs.length ? ' · Bestes Leg: ' + Math.min(...st.legs) : ''}</div>
    ${chipsOf(c.c.cur ? c.c.cur.d.map(lbl) : (P.v.length ? P.v.at(-1).d.map(lbl) : []))}</div>${hintOf(P.rem, left)}`;
  }
  if (done) return `<div class="wrap">${top}${body}${trainDone(s, st)}</div>`;

function trainDone(s, st) {
  const kv = s.kind === 'fin' ? [['Geschafft', st.ok + ' von ' + st.att], ['Quote', pc0(st.ok, st.att)]]
    : s.kind === 'sc' ? [['Average', st.avg.toFixed(1)], ['Aufnahmen', st.vis], ['180er', st.h180], ['140+', st.h140], ['100+', st.h100], ['Ziel-Average', s.o.goal ? (st.avg >= s.o.goal ? 'erreicht' : 'verpasst') : '–']]
    : s.kind === 'fld' ? [['Treffer', st.hits + ' von ' + st.darts], ['Quote', pc0(st.hits, st.darts)], ['3 Treffer', st.hv[3] + ' Aufnahmen']]

}

function trainTab(rows) {
  const by = k => rows.filter(r => r.state.tr.kind === k).map(r => ({ s: r.state.tr, t: r.created_at, st: tstat(r.state.tr) }));

  const sum = (a, f) => a.reduce((x, y) => x + f(y.st), 0);

    const A = sum(fin, t => t.att), O = sum(fin, t => t.ok), list = Object.entries(per).map(([r, [a, h]]) => ({ r: +r, a, h }));
    const weak = list.filter(x => x.a >= 2).sort((a, b) => a.h / a.a - b.h / b.a || b.a - a.a).slice(0, 5).map(x => `${x.r} (${pc0(x.h, x.a)})`).join(', ');
    const tbl = list.sort((a, b) => a.r - b.r).map(x => `<tr><td>${x.r}</td><td>${x.a}</td><td>${x.h}</td><td>${pc0(x.h, x.a)}</td></tr>`).join('');
    const last = fin.slice(-6).map(x => pc0(x.st.ok, x.st.att)).join(', ');
    out += kvc('Finishing', [['Versuche', A], ['Geschafft', O + ' (' + pc0(O, A) + ')'], ['Einheiten', fin.length], ['Letzte Einheiten', last]],
      `<p><b>Schwächste Reste:</b> ${weak || 'Noch zu wenig Versuche'}</p><details><summary>Alle Reste</summary><div style="overflow-x:auto"><table><tr><th>Rest</th><th>Versuche</th><th>Geschafft</th><th>Quote</th></tr>${tbl}</table></div></details>`);
  }
  if (sc.length) {
    const D = sum(sc, t => t.darts), P = sum(sc, t => t.pts), best = Math.max(...sc.map(x => x.st.avg));
    const goals = sc.filter(x => x.s.o.goal), hit = goals.filter(x => x.st.avg >= x.s.o.goal).length;
    const last = sc.slice(-5).reverse().map(x => `<div class="brow"><span>${dt(x.t)}</span><span style="text-align:right">Ø ${x.st.avg.toFixed(1)}${x.s.o.goal ? (x.st.avg >= x.s.o.goal ? ' ✓' : ' ✗') : ''} (${x.st.vis} Aufn.)</span></div>`).join('');
    out += kvc('Scoring', [['Einheiten', sc.length], ['Average', D ? (P / D * 3).toFixed(1) : '–'], ['Bester Average', best.toFixed(1)], ['Ziel-Average erreicht', goals.length ? hit + ' von ' + goals.length : '–'], ['180er', sum(sc, t => t.h180)], ['140+', sum(sc, t => t.h140)], ['100+', sum(sc, t => t.h100)]], `<h2 style="margin-top:12px">Letzte Einheiten</h2>${last}`);
  }
  if (fl.length) {
    const g = {}; fl.forEach(x => { const a = g[x.s.o.field] ??= { n: 0, d: 0, h: 0, b: 0 }; a.n++; a.d += x.st.darts; a.h += x.st.hits; a.b = Math.max(a.b, x.st.darts ? x.st.hits / x.st.darts : 0); });
    const tbl = Object.entries(g).map(([f, a]) => `<tr><td>${f}</td><td>${a.n}</td><td>${a.h}/${a.d}</td><td>${pc0(a.h, a.d)}</td><td>${Math.round(a.b * 100)}%</td></tr>`).join('');
    out += `<div class="card" style="overflow-x:auto"><h2>Zielfeld</h2><table><tr><th>Feld</th><th>Einheiten</th><th>Treffer</th><th>Quote</th><th>Beste</th></tr>${tbl}</table></div>`;
  }
  if (lg.length) {
    const L = lg.flatMap(x => x.st.legs), D = sum(lg, t => t.darts), P = sum(lg, t => t.pts), ch = sum(lg, t => t.ch), co = sum(lg, t => t.co);
    const b = {}; lg.forEach(x => { const k = x.s.cfg.start; (b[k] ??= []).push(...x.st.legs); });
    out += kvc('Legs', [['Legs gewonnen', L.length], ['Ø Darts pro Leg', L.length ? (L.reduce((a, c) => a + c, 0) / L.length).toFixed(1) : '–'], ['Average', D ? (P / D * 3).toFixed(1) : '–'], ['Checkout-Quote', ch ? pc0(co, ch) + ' (' + co + '/' + ch + ')' : '–'],
      ...Object.entries(b).map(([k, a]) => ['Bestes ' + k + '-Leg', a.length ? Math.min(...a) + ' Darts' : '–'])]);
  }
  const f = {}; let nd = 0;
  rows.forEach(r => { const s = r.state.tr; if (s.kind !== 'fin') s.ev.forEach(e => { if (e[0]) { const k = tkey(e); f[k] = (f[k] || 0) + 1; nd++; } }); });
  if (nd) out += `<div class="card"><h2>Trefferbild im Training</h2>${boardBox(f)}<p class="mute sm">Alle Darts aus Scoring, Zielfeld und Legs.</p></div>`;
  return out + `<button class="ghost" style="width:100%" onclick="trainReset()">Trainingsdaten ausblenden</button>`;
}

const RPC_SQL = `create or replace function ev_push(p_id text, p_e jsonb, p_op text default null)
returns jsonb language plpgsql as $$
declare s jsonb; o jsonb;
begin
  select state into s from public.matches where id = p_id for update;
  if s is null then raise exception 'match not found'; end if;
  o := coalesce(s->'ops', '[]'::jsonb);
  if p_op is not null and o @> jsonb_build_array(p_op) then return s; end if;
  s := jsonb_set(s, '{ev}', coalesce(s->'ev', '[]'::jsonb) || jsonb_build_array(p_e));
  s := (s - 'del' - 'auto');
  s := jsonb_set(s, '{v}', to_jsonb(coalesce((s->>'v')::int, 0) + 1));
  if p_op is not null then
    o := o || jsonb_build_array(p_op);
    if jsonb_array_length(o) > 30 then o := o - 0; end if;
    s := jsonb_set(s, '{ops}', o);
  end if;
  update public.matches set state = s, updated_at = now() where id = p_id;
  return s;
end $$;

create or replace function ev_pop(p_id text)
returns jsonb language plpgsql as $$
declare s jsonb; n int;
begin
  select state into s from public.matches where id = p_id for update;
  if s is null then raise exception 'match not found'; end if;
  n := jsonb_array_length(coalesce(s->'ev', '[]'::jsonb));
  if n > 0 then s := jsonb_set(s, '{ev}', (s->'ev') - (n - 1)); end if;
  s := (s - 'del' - 'auto');
  s := jsonb_set(s, '{v}', to_jsonb(coalesce((s->>'v')::int, 0) + 1));
  update public.matches set state = s, updated_at = now() where id = p_id;
  return s;
end $$;`;

// Offene Matches ohne Aktivität kommen nach HID.ac Minuten in den Papierkorb (0 = aus). Läuft in jedem geöffneten Browser.
async function autoClean() {
  const min = HID.ac; if (!(min > 0)) return;
  const cut = new Date(Date.now() - min * 60000).toISOString();
  const { data, error } = await db.from('matches').select('id,state,updated_at').eq('finished', false).neq('id', '_CONFIG').not('id', 'like', 'TR-%').lt('updated_at', cut).limit(50);
  if (error || !data) return;
  let n = 0;
  for (const r of data) {
    if (!r.state || !r.state.cfg || r.state.del || (match && match.id === r.id)) continue;
    // nur schreiben, wenn sich das Match seit dem Lesen nicht verändert hat
    const { data: u } = await db.from('matches').update({ state: { ...r.state, del: 1, auto: 1 } }).eq('id', r.id).eq('updated_at', r.updated_at).select('id');
    if (u && u.length) n++;
  }
  if (n) { loadKnown(); if (adm && view === 'admin') { await admLoad(); render(); } }
}
async function admAc(v) { await loadHid(); HID.ac = +v; await saveHid(); toast(+v ? 'Aufräumen nach ' + v + ' Minuten' : 'Automatisches Aufräumen aus'); autoClean(); render(); }
const admOld = r => admKind(r) === 'm' && !r.finished && !r.state.del && Date.now() - new Date(r.created_at) > 6 * 3600e3;
async function admWrite(r, st) {
  const { error } = await db.from('matches').update({ state: st }).eq('id', r.id);
  if (error) return false;
  r.state = st; return true;
}
async function admDel(id, on) {
  const r = ADM.find(x => x.id === id); if (!r) return;
  if (on && !confirm('In den Papierkorb legen? Du kannst es dort wiederherstellen.')) return;
  const st = { ...r.state }; if (on) st.del = 1; else delete st.del;
  if (!await admWrite(r, st)) return toast('Speichern fehlgeschlagen');
  toast(on ? 'In den Papierkorb gelegt' : 'Wiederhergestellt'); await admAfter();
}

}
async function admPurge(ids) {

  const { data, error } = await db.from('matches').delete().in('id', ids).select('id');
  const gone = (data || []).map(x => x.id);
  ADM = ADM.filter(r => !gone.includes(r.id));
  if (error || gone.length < ids.length) { alert('Nur ' + gone.length + ' von ' + ids.length + ' wurden gelöscht. Wahrscheinlich ist Löschen in Supabase noch nicht erlaubt. Die Anleitung steht im Reiter „Daten“.'); }
  else toast(gone.length + ' endgültig gelöscht');
  await admAfter();
}
async function admRename(i) {
  const p = ADMP[i]; if (!p) return;
  const v = prompt(`Neuer Name für ${p.n}:`, p.n);
  if (v === null) return;
  const nv = v.trim().slice(0, 20); if (!nv || nv === p.n) return;
  const ol = p.n.toLowerCase(), nl = nv.toLowerCase(), isP = (x, l) => String(x).trim().toLowerCase() === l;
  const hit = ADM.filter(r => (r.state.cfg && r.state.cfg.players.some(x => isP(x, ol))) || (r.state.tr && isP(r.state.tr.name, ol)));
  if (ol !== nl && hit.some(r => r.state.cfg && r.state.cfg.players.some(x => isP(x, nl))))
    return alert(`Zusammenführen geht nicht: In manchen Matches spielen ${p.n} und ${nv} gegeneinander. Ändere zuerst diese Matches im Reiter „Matches“ mit „Namen ändern“.`);
  const merge = ol !== nl && ADMP.some(x => x.n.toLowerCase() === nl);
  if (!confirm(`${p.n} in ${nv} ${merge ? 'umbenennen und mit dem vorhandenen Spieler zusammenführen' : 'umbenennen'}?\n${hit.length} Einträge werden geändert.`)) return;
  let bad = 0;
  for (let k = 0; k < hit.length; k += 8) await Promise.all(hit.slice(k, k + 8).map(async r => {
    const st = { ...r.state };
    if (st.cfg) st.cfg = { ...st.cfg, players: st.cfg.players.map(x => isP(x, ol) ? nv : x) };
    if (st.tr) st.tr = { ...st.tr, name: nv };
    if (!await admWrite(r, st)) bad++;

  if (!S.clip || !window.MediaRecorder) return '';
  const c = clips.visit;
  if (!c) return Object.keys(CL.rec).length ? '<div class="mute sm" style="text-align:center;margin:6px 0">● Clip-Aufnahme läuft</div>' : '';
  return `<button class="ghost" style="width:100%;margin:6px 0" onclick="saveClip('visit')">🎬 Letzte Aufnahme speichern (${esc(c.name)}, ${c.bust ? 'Bust' : c.sum})</button>`;
}
async function saveClip(k) {
  const c = clips[k]; if (!c) return toast('Kein Clip vorhanden');
  const d = new Date(), z = x => String(x).padStart(2, '0');
  const name = `dart-${k === 'win' ? 'gewinnwurf' : 'aufnahme'}-${z(d.getHours())}${z(d.getMinutes())}.${c.ext}`;
  try {
    const f = new File([c.blob], name, { type: c.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Dart-Abend' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(c.blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('Clip wird gespeichert');
}

// ---------- Chat im Match ----------
// Nachrichten laufen live über einen Supabase-Broadcast-Kanal (nichts wird gespeichert). Das Fenster liegt außerhalb von #app,
// damit eingetippter Text beim Neuzeichnen des Matches nicht verloren geht.
let chCh = null, chat = [], chatOpen = false, chatNew = 0, cname = '';
try { cname = localStorage.getItem('cn') || localStorage.getItem('dn') || ''; } catch (e) {}
function chatJoin(id) {
  chatLeave(); chat = []; chatNew = 0;
  try { chCh = db.channel('chat' + id); chCh.on('broadcast', { event: 'msg' }, ({ payload: m }) => chatAdd(m, false)).subscribe(); } catch (e) { chCh = null; }
}
function chatLeave() { const c = chCh; chCh = null; chatOpen = false; chat = []; chatNew = 0; if (c) { try { db.removeChannel(c); } catch (e) {} } chatUi(); }
function chatAdd(m, mine) {
  if (!m || typeof m.t !== 'string' || !m.t.trim()) return;
  chat.push({ n: String(m.n || 'Gast').slice(0, 20), t: m.t.slice(0, 300), me: mine });
  if (chat.length > 100) chat.shift();
  if (!chatOpen && !mine) { chatNew++; toast(String(m.n || 'Gast').slice(0, 20) + ': ' + m.t.slice(0, 60)); }
  chatUi();
}
function chatSend() {
  const inp = $('#chIn'), nm = $('#chNm'); if (!inp || !chCh) return;
  const t = inp.value.trim(); if (!t) return;
  const n = ((nm && nm.value) || '').trim().slice(0, 20) || 'Gast'; cname = n;
  try { localStorage.setItem('cn', n); } catch (e) {}
  chCh.send({ type: 'broadcast', event: 'msg', payload: { n, t: t.slice(0, 300) } });
  chatAdd({ n, t }, true); inp.value = ''; inp.focus();
}
function chatToggle(o) {
  chatOpen = o; if (o) chatNew = 0;
  chatUi();
  if (o) setTimeout(() => { const i = $('#chIn'); if (i) i.focus(); }, 50);
}
function chatUi() {
  const root = $('#chatRoot'); if (!root || !root.dataset) return;
  if (!match) { root.innerHTML = ''; root.dataset.k = ''; return; }
  if (!chatOpen) {
    const k = 'b' + chatNew;
    if (root.dataset.k !== k) { root.dataset.k = k; root.innerHTML = `<button class="chbtn" onclick="chatToggle(true)" aria-label="Chat öffnen">💬${chatNew ? `<i>${chatNew > 9 ? '9+' : chatNew}</i>` : ''}</button>`; }
    return;
  }
  if (root.dataset.k !== 'p') {
    root.dataset.k = 'p'; root.dataset.n = '-1';
    root.innerHTML = `<div class="chp" role="dialog" aria-label="Chat"><div class="top" style="margin:0"><b>Chat</b><button class="ghost" onclick="chatToggle(false)" aria-label="Chat schließen">✕</button></div>
    <div class="chl" id="chL"></div>
    <form onsubmit="chatSend();return false"><input class="in" id="chNm" maxlength="20" placeholder="Dein Name" value="${esc(cname)}" style="margin-bottom:8px">
    <div class="chrow"><input class="in" id="chIn" maxlength="300" placeholder="Nachricht" autocomplete="off"><button class="main" style="width:auto;margin:0" aria-label="Senden">Senden</button></div></form></div>`;
  }
  if (root.dataset.n !== String(chat.length)) {
    root.dataset.n = String(chat.length);
    const l = $('#chL'); if (!l) return;
    l.innerHTML = chat.length ? chat.map(m => `<div class="chm ${m.me ? 'me' : ''}"><b>${esc(m.n)}</b>${esc(m.t)}</div>`).join('') : '<p class="mute sm">Hier schreiben alle, die gerade in diesem Match sind. Nachrichten werden nicht gespeichert.</p>';
    l.scrollTop = l.scrollHeight;
  }
}

// ---------- Adressen und Zurück (Router) ----------
// Jeder Bereich hat eine eigene Adresse (#/ranking, #/neu, ...), ein Match hat ?m=CODE. Wechselt die App den Bereich,
// legt sie einen Verlaufseintrag an. Zurück/Vorwärts des Browsers lesen die Adresse und stellen den Bereich wieder her.
function render() { render0(); syncUrl(); chatUi(); }
let HS = [], hi = 0, popping = false, noSync = true, skipPop = 0;
const encU = x => encodeURIComponent(x || '');
const ROUTES = { '': 'home', neu: 'new', beitreten: 'join', training: 'tsetup', ranking: 'stats', profil: 'player', verlauf: 'hist', duell: 'duel', admin: 'admin' };
function wantUrl() {
  const base = location.pathname;
  if (match) return base + '?m=' + match.id + (psec ? '&p=' + encU(psec) : '');
  if (TS) return base + '#/training/lauf';
  const r = { home: '', new: 'neu', join: 'beitreten', tsetup: 'training', stats: 'ranking', player: 'profil/' + encU(pk), hist: 'verlauf' + (histF ? '/' + encU(histF) : ''), duel: 'duell/' + encU(duelA) + '/' + encU(duelB), admin: 'admin', aedit: 'admin/match' }[view];
  return base + (r ? '#/' + r : '');
}
function syncUrl() {
  if (noSync || skipPop > 0) return;
  try {
    const u = wantUrl(), cur = location.pathname + location.search + location.hash;
    if (u === cur) return;
    if (popping) { history.replaceState({ i: hi }, '', u); HS[hi] = u; }
    else if (hi > 0 && HS[hi - 1] === u) { skipPop++; history.back(); }
    else { HS = HS.slice(0, hi + 1); history.pushState({ i: hi + 1 }, '', u); hi++; HS[hi] = u; }
  } catch (e) {}
}
function stay() { skipPop++; history.go(1); }
async function applyUrl() {
  const q = new URLSearchParams(location.search), m = (q.get('m') || '').toUpperCase();
  const h = location.hash.replace(/^#\/?/, '').split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (showSet || camPick || adel !== null || chatOpen) { showSet = false; camPick = false; adel = null; chatOpen = false; skipPop++; render0(); chatUi(); history.go(1); return; } // Fenster nur schließen
  if (m) {
    if (!match || match.id !== m) await openMatch(m, q.get('p')); else render();
    return;
  }
  if (match) {
    if (!watch && calc(match.st.cfg, match.st.ev).winner === null && !confirm('Match verlassen? Mit deinem Spielercode kannst du wieder beitreten.')) return stay();
    leave(true);
  }
  const r = h[0] || '';
  let v = ROUTES[r] || 'home';
  if (r === 'training' && h[1] === 'lauf') { if (TS) { render(); return; } v = 'tsetup'; }
  if (TS) { TS = null; camLeave(); unwake(); }
  if (r === 'admin' && h[1] === 'match' && AE) v = 'aedit';
  if (v === 'admin' && !adm) v = 'home';
  if (v === 'player' || v === 'hist' || v === 'duel' || v === 'stats') {
    if (!SC) await Promise.all([loadStatsData(), loadTrain()]);
    if (!SC) v = 'home';
    else if (v === 'player') { pk = (h[1] || '').toLowerCase(); if (!pk) v = 'stats'; else { if (pfrom !== 'tsetup') pfrom = 'stats'; } }
    else if (v === 'hist') histF = (h[1] || '').toLowerCase();
    else if (v === 'duel') { duelA = h[1] || ''; duelB = h[2] || ''; if (!duelA || !duelB) v = 'stats'; }
  }
  if (v === 'join') { LIVE = null; loadLive(); }
  view = v; render(); scrollTo(0, 0);
}
addEventListener('popstate', async e => {
  hi = e.state && e.state.i != null ? e.state.i : hi;
  HS[hi] = location.pathname + location.search + location.hash;
  if (skipPop > 0) { skipPop--; return; }
  popping = true;
  try { await applyUrl(); } catch (er) { render(); } finally { popping = false; }
});
function routerInit() {
  hi = history.state && history.state.i != null ? history.state.i : 0;
  HS[hi] = location.pathname + location.search + location.hash;
  try { history.replaceState({ i: hi }, '', HS[hi]); } catch (e) {}
  popping = true;
  applyUrl().catch(() => {}).finally(() => { noSync = false; render(); popping = false; });
}

// ---------- Start ----------
loadKnown().then(autoClean); setInterval(autoClean, 120000);
routerInit();
</script>
