<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dart-Abend</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14282A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dart-Abend">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#14282A;--panel:#1C3538;--line:#2C4A4D;--chalk:#F1EFE8;--mute:#8FA8A4;--red:#E4483D;--green:#3DAA74}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.4 Karla,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
h1{font-size:2.6rem}h2{font-size:1.2rem;margin-bottom:10px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:inherit;padding:12px;margin-bottom:8px}
button{font:inherit;color:var(--chalk);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}
button:focus-visible,.in:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.main{width:100%;background:var(--green);border-color:var(--green);color:#0c1d1a;font-weight:700;margin-top:6px}
.ghost{background:none}
.seg{display:flex;gap:8px;margin:8px 0}.seg>*{flex:1}
.seg .on{background:var(--chalk);color:var(--bg);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.top button{padding:8px 10px}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;min-width:0}
.col.act{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.col.won{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1.1;margin:4px 0}
.sm{font-size:.85rem}
.last{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;min-height:1.4em}
.last span{background:var(--bg);border-radius:6px;padding:0 6px}
.last .bust{color:var(--red)}
.hint{text-align:center;min-height:1.6em;margin:12px 0 4px;color:var(--mute)}.hint b{color:var(--chalk)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.r4{grid-template-columns:repeat(4,1fr)}
.nums button{font-family:Oswald,sans-serif;font-size:1.3rem;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{color:var(--mute);font-weight:400;font-size:.8rem}
.win{text-align:center}
.crow{display:grid;grid-template-columns:90px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
.bar{background:var(--bg);border-radius:6px;height:22px}.bar i{display:block;height:100%;background:var(--green);border-radius:6px;min-width:2px}
#camBox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:560px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{position:relative}.tile.big{grid-column:1/-1}
.tile span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:0 8px;border-radius:6px;font-size:.8rem}
.tile video{width:100%;height:15vh;object-fit:cover;border-radius:14px;background:#000;display:block;cursor:pointer}
.tile.me video{touch-action:none}
.tile.big video{height:42vh}
.tile input{position:absolute;right:8px;bottom:6px;width:48%}
@media (min-width:900px){.tile video{height:26vh}.tile.big video{height:50vh}}
.prow{display:flex;gap:8px}.prow input{flex:3;min-width:0}.prow select{flex:2;min-width:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.panel h3{margin:16px 0 2px;font-family:Oswald,sans-serif;color:var(--mute);font-weight:500;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.srow input[type=range]{width:55%;accent-color:var(--green)}
.srow select{padding:8px;font:inherit;color:var(--chalk);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.th{background:none;border:0;padding:4px 2px;color:var(--mute);font-size:.8rem;border-radius:6px}
.th.on{color:var(--chalk);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
td.bst{color:var(--green);font-weight:700}
.et th:nth-child(n+2),.et td:nth-child(n+2){text-align:right}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:Oswald,sans-serif;font-size:1.3rem;font-weight:700}
.lnk{background:none;border:0;color:var(--chalk);padding:0;font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stack{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:6px 0}.stack i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{padding:6px 12px;border-radius:999px;font-size:.9rem}
.chip.on{background:var(--chalk);color:var(--bg);font-weight:700}
.brow{display:grid;grid-template-columns:62px 1fr 74px;gap:8px;align-items:center;margin:5px 0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
</style>
</head>
<body>
<div id="camBox" hidden></div>
<div id="app"></div>
<script>
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let names = ['', ''], outs = ['double', 'double'], watch = false, vtab = 'throws', psec = '', showPc = false, shareOpen = false, start = 501, legsW = 3, setsW = 1, match = null, channel = null, mult = 1;

// ---------- Checkout-Weg (Double-Out) ----------
const D = [];
for (let i = 1; i <= 20; i++) D.push({l:'S'+i,v:i,d:0},{l:'D'+i,v:2*i,d:1},{l:'T'+i,v:3*i,d:0});
D.push({l:'25',v:25,d:0},{l:'Bull',v:50,d:1});
D.sort((a,b) => b.v - a.v);
const FIN = D.filter(x => x.d);
function route(r, max = 3, rule = 'double') {
  const single = rule === 'single';
  if (r > (single ? 180 : 170) || r < (single ? 1 : 2)) return null;
  const F = single ? D : rule === 'master' ? D.filter(x => x.d || x.l[0] === 'T') : FIN;
  for (const f of F) if (f.v === r) return [f.l];
  if (max >= 2) for (const a of D) for (const f of F) if (a.v + f.v === r) return [a.l, f.l];
  if (max >= 3) for (const a of D) for (const b of D) for (const f of F) if (a.v + b.v + f.v === r) return [a.l, b.l, f.l];
  return null;
}
const RL = { single: 'Single Out', double: 'Double Out', master: 'Master Out' };
const lbl = ([m, x]) => !m ? '0' : (m === 2 && x === 25 ? 'Bull' : (m === 1 ? '' : m === 2 ? 'D' : 'T') + x);

// ---------- Spiellogik: Zustand wird aus der Wurfliste berechnet ----------
function calc(cfg, ev) {
  const n = cfg.players.length;
  const P = cfg.players.map((name, i) => ({ name, rule: (cfg.outs || [])[i] || 'double', rem: cfg.start, legs: 0, sets: 0, v: [] }));
  let leg = 0, starter = 0, turn = 0, cur = null, winner = null;
  for (let ei = 0; ei < ev.length; ei++) {
    const [m, x] = ev[ei];
    if (winner !== null) break;
    const p = P[turn];
    if (!cur) cur = { before: p.rem, d: [], sum: 0, leg };
    cur.d.push([m, x]); cur.sum += m * x; cur.n = ei;
    const after = cur.before - cur.sum;
    const okFin = p.rule === 'single' || (p.rule === 'master' ? m >= 2 : m === 2);
    if (after < 0 || (after === 1 && p.rule !== 'single') || (after === 0 && !okFin)) {
      cur.bust = true; cur.sum = 0; p.rem = cur.before; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else if (after === 0) {
      cur.win = true; p.v.push(cur); cur = null; p.legs++;
      if (p.legs >= cfg.legs) { p.sets++; P.forEach(q => q.legs = 0); if (p.sets >= cfg.sets) winner = turn; }
      if (winner === null) { leg++; P.forEach(q => q.rem = cfg.start); starter = (starter + 1) % n; turn = starter; } else p.rem = 0;
    } else if (cur.d.length === 3) {
      p.rem = after; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else p.rem = after;
  }
  return { P, turn, cur, winner };
}
const nVis = c => c.P.reduce((a, p) => a + p.v.length, 0);

// ---------- Ansichten ----------
function home() {
  const opt = (arr, cur, f) => arr.map(n => `<option value="${n}" ${cur === n ? 'selected' : ''}>${f(n)}</option>`).join('');
  return `<div class="wrap"><h1>Dart-Abend</h1><p class="mute">Spielstand live auf allen Geräten.</p>
  <div class="card"><h2>Neues Match</h2>
  ${names.map((n, i) => `<div class="prow"><input class="in" placeholder="Spieler ${i+1}" value="${esc(n)}" onchange="names[${i}]=this.value"><select class="in" aria-label="Check-out-Regel" onchange="outs[${i}]=this.value">${[['double','Double Out'],['master','Master Out'],['single','Single Out']].map(([v, l]) => `<option value="${v}" ${outs[i] === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}
  ${chips()}
  ${names.length < 4 ? '<button class="ghost" onclick="addP()">Spieler hinzufügen</button>' : ''}
  <div class="seg"><button class="${start===501?'on':''}" onclick="start=501;render()">501</button><button class="${start===301?'on':''}" onclick="start=301;render()">301</button></div>
  <div class="seg"><select class="in" onchange="legsW=+this.value">${opt([1,2,3,4,5], legsW, n => n + (n > 1 ? ' Legs' : ' Leg') + ' pro Satz')}</select>
  <select class="in" onchange="setsW=+this.value">${opt([1,2,3,4,5], setsW, n => n + (n > 1 ? ' Sätze' : ' Satz') + ' zum Sieg')}</select></div>
  <button class="main" onclick="create()">Match starten</button></div>
  <div class="card"><h2>Match beitreten</h2>
  <input class="in" id="code" placeholder="Code eingeben" maxlength="14" autocapitalize="characters" style="text-transform:uppercase">
  <p class="mute sm" style="margin:0 0 8px">Mit dem Zahlen-Code (3 Ziffern) schaust du zu. Mit dem Buchstaben-Code kannst du mitspielen und eintragen.</p>
  <button class="main" onclick="joinCode()">Beitreten</button></div>
  <div class="seg"><button class="ghost" onclick="showStats()">Ranking und Statistiken</button><button class="ghost" onclick="toggleSet()">⚙ Einstellungen</button></div></div>`;
}

function col(p, i, c) {
  const act = c.turn === i && c.winner === null;
  const pts = p.v.reduce((a, v) => a + v.sum, 0), dr = p.v.reduce((a, v) => a + v.d.length, 0);
  const shown = act && c.cur ? c.cur.d.map(lbl) : (p.v.length ? p.v.at(-1).d.map(lbl) : []);
  const bust = !act && p.v.length && p.v.at(-1).bust;
  return `<div class="col ${act ? 'act' : ''} ${c.winner === i ? 'won' : ''}">
  <div class="nm">${esc(p.name)}</div><div class="mute sm">${RL[p.rule]}</div><div class="num big">${p.rem}</div>
  <div class="mute sm">Sätze ${p.sets} / Legs ${p.legs}</div><div class="mute sm">Ø ${dr ? (pts / dr * 3).toFixed(1) : '–'}</div>
  <div class="last">${shown.map(x => `<span class="${bust ? 'bust' : ''}">${x}</span>`).join('')}</div></div>`;
}

function pad() {
  return `<div class="seg">${[['Single',1],['Double',2],['Triple',3]].map(([l, m]) => `<button class="${mult === m ? 'on' : ''}" onclick="mult=${m};render()">${l}</button>`).join('')}</div>
  <div class="nums">${Array.from({length:20}, (_, i) => `<button onclick="dart(${i+1})">${i+1}</button>`).join('')}</div>
  <div class="nums r4"><button onclick="dart(25)">25</button><button onclick="dart('B')">Bull</button><button onclick="dart(0)">Daneben</button><button onclick="undo()" aria-label="Letzten Dart zurücknehmen">↶</button></div>`;
}

function matchView() {
  const st = match.st, c = calc(st.cfg, st.ev), cp = c.P[c.turn];
  const left = 3 - (c.cur ? c.cur.d.length : 0);
  const hint = !watch && c.winner === null ? route(cp.rem, left, cp.rule) : null;
  const w = c.winner !== null ? endView(c) : '';
  const sh = shareOpen && !watch ? `<div class="seg"><button onclick="share(false)">Link zum Mitspielen</button><button onclick="share(true)">Link für Zuschauer</button></div>` : '';
  const pc = watch ? '' : `<div style="margin:0 0 8px"><button class="ghost" style="padding:6px 10px;font-size:.85rem" onclick="showPc=!showPc;render()">${showPc ? 'Spielercode verbergen' : 'Spielercode anzeigen'}</button></div>`
    + (showPc ? `<div class="card win" style="margin:0 0 10px"><div class="mute sm">Spielercode (nur für Mitspieler)</div><div class="num" style="font-size:1.8rem">${esc(psec)}</div><button class="ghost" onclick="copyPc()">Kopieren</button></div>` : '');
  const bottom = c.winner !== null ? w : watch ? viewerPanel(c)
    : `<div class="hint">${hint && S.chk ? 'Checkout: <b>' + hint.join(', ') + '</b>' : '&nbsp;'}</div>${pad()}`;
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button>
  <span class="mute">Zuschauer-Code <b style="color:var(--chalk)">${match.st.vc || match.id}</b></span>
  <span>${watch ? '' : `<button class="ghost" onclick="toggleCam()">${stream ? 'Kamera aus' : 'Kamera'}</button> `}<button class="ghost" onclick="toggleVoice()" aria-label="Ton an oder aus">${S.on ? '🔊' : '🔇'}</button> <button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button> <button class="ghost" onclick="${watch ? 'share(true)' : 'shareOpen=!shareOpen;render()'}">Teilen</button></span></div>${sh}${pc}
  <div class="board" style="--n:${c.P.length}">${c.P.map((p, i) => col(p, i, c)).join('')}</div>
  ${bottom}</div>`;
}

// ---------- Statistiken ----------
function agg(rows) {
  const A = {}; let gi = 0;
  for (const r of rows) {
    if (!r.state.cfg) continue;
    gi++;
    const c = r.c ??= calc(r.state.cfg, r.state.ev);
    c.P.forEach((p, i) => {
      const k = p.name.trim().toLowerCase();
      const s = A[k] ??= { n: p.name.trim(), g: 0, w: 0, pts: 0, dr: 0, f9: 0, f9d: 0, h180: 0, h140: 0, hf: 0, ch: 0, co: 0, av: [] };
      s.g++; if (c.winner === i) s.w++;
      let pts = 0, dr = 0; const seen = {};
      for (const v of p.v) {
        pts += v.sum; dr += v.d.length;
        if (v.sum === 180) s.h180++; else if (v.sum >= 140) s.h140++;
        seen[v.leg] = (seen[v.leg] || 0) + 1;
        if (seen[v.leg] <= 3) { s.f9 += v.sum; s.f9d += v.d.length; }
        if (route(v.before, 3, p.rule)) { s.ch++; if (v.win) { s.co++; s.hf = Math.max(s.hf, v.sum); } }
      }
      s.pts += pts; s.dr += dr; s.av.push([gi, dr ? pts / dr * 3 : 0]);
    });
  }
  return { list: Object.values(A), total: gi };
}

// Werte eines beendeten Matches (für den Endscreen)
function mstats(c) {
  return c.P.map(p => {
    const m = { hi: 0, avg: 0, f9: 0, h180: 0, h140: 0, h100: 0, hf: 0, ch: 0, co: 0, best: 0, darts: 0, legs: 0 };
    let pts = 0, f9 = 0, f9d = 0; const seen = {}, ld = {};
    for (const v of p.v) {
      m.hi = Math.max(m.hi, v.sum); m.darts += v.d.length; pts += v.sum; ld[v.leg] = (ld[v.leg] || 0) + v.d.length;
      if (v.sum === 180) m.h180++; else if (v.sum >= 140) m.h140++; else if (v.sum >= 100) m.h100++;
      seen[v.leg] = (seen[v.leg] || 0) + 1; if (seen[v.leg] <= 3) { f9 += v.sum; f9d += v.d.length; }
      if (route(v.before, 3, p.rule)) m.ch++;
      if (v.win) { m.co++; m.legs++; m.hf = Math.max(m.hf, v.sum); m.best = m.best ? Math.min(m.best, ld[v.leg]) : ld[v.leg]; }
    }
    m.avg = m.darts ? pts / m.darts * 3 : 0; m.f9 = f9d ? f9 / f9d * 3 : 0;
    return m;
  });
}
function endView(c) {
  const M = mstats(c), cfg = match.st.cfg, legs = M.map(m => m.legs).join(' : ');
  const rows = [
    ['Average', m => m.avg, m => m.avg.toFixed(1), 1], ['First 9', m => m.f9, m => m.f9.toFixed(1), 1],
    ['180er', m => m.h180, m => m.h180, 1], ['140+', m => m.h140, m => m.h140, 1], ['100+', m => m.h100, m => m.h100, 1],
    ['Höchstes Finish', m => m.hf, m => m.hf || '–', 1],
    ['Checkout-Quote', m => m.ch ? m.co / m.ch : 0, m => m.ch ? Math.round(m.co / m.ch * 100) + '% (' + m.co + '/' + m.ch + ')' : '–', 1],
    ['Schnellstes Leg', m => m.best || 999, m => m.best ? m.best + ' Darts' : '–', -1],
    ['Darts gesamt', m => m.darts, m => m.darts, 0]
  ];
  const tr = rows.map(([l, g, f, dir]) => {
    const vals = M.map(g), top = dir === 1 ? Math.max(...vals) : Math.min(...vals);
    const mark = dir !== 0 && new Set(vals).size > 1 && (dir === 1 ? top > 0 : top < 999);
    return `<tr><td>${l}</td>${M.map((m, i) => `<td class="${mark && vals[i] === top ? 'bst' : ''}">${f(m)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="card win"><div class="mute sm">Spiel beendet</div><h2 style="font-size:1.9rem">${esc(c.P[c.winner].name)} gewinnt</h2>
  <div class="num" style="font-size:2.8rem">${cfg.sets > 1 ? c.P.map(p => p.sets).join(' : ') : legs}</div>
  <div class="mute sm">${cfg.sets > 1 ? 'Sätze, Legs insgesamt ' + legs : 'Legs'}</div>
  <div style="overflow-x:auto;margin-top:12px"><table class="et"><tr><th></th>${c.P.map(p => `<th style="max-width:90px;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</th>`).join('')}</tr>${tr}</table></div>
  ${throwLog(c)}
  ${watch ? '' : '<button class="main" onclick="rematch()">Revanche</button><button class="ghost" style="width:100%;margin-top:8px" onclick="undo()">Letzten Dart korrigieren</button>'}
  <button class="ghost" style="width:100%;margin-top:8px" onclick="showStats()">Zum Ranking</button></div>`;
}

// ---------- Daten laden, ausblenden ----------
const PAL = ['#3DAA74', '#E4483D', '#F2C14E', '#5AA9E6', '#B08BDB', '#F28C4E', '#4FD1C5', '#E879A6'];
let HID = { hp: [], hm: [] }, ROWS = [], VIS = [], SC = null, known = [], edit = false, pk = '', duelA = '', duelB = '', histF = '', RK = [];
const colorOf = n => PAL[SC.list.map(s => s.n.toLowerCase()).sort().indexOf(n.toLowerCase()) % PAL.length];
const pc0 = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
const dt = x => { const d = new Date(x); return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
async function loadHid() {
  const { data } = await db.from('matches').select('state').eq('id', '_CONFIG').maybeSingle();
  if (data && data.state) HID = { hp: data.state.hp || [], hm: data.state.hm || [] };
}
async function saveHid() {
  const { error } = await db.from('matches').upsert({ id: '_CONFIG', state: HID, finished: false });
  if (error) toast('Speichern fehlgeschlagen');
}
async function loadKnown() {
  await loadHid();
  let { data, error } = await db.from('matches').select('cfg:state->cfg').neq('id', '_CONFIG').order('created_at', { ascending: false }).limit(300);
  if (error) { const r = await db.from('matches').select('state').neq('id', '_CONFIG').limit(300); data = (r.data || []).map(x => ({ cfg: x.state.cfg })); }
  const cnt = {};
  (data || []).forEach(x => x.cfg && x.cfg.players && x.cfg.players.forEach(n => { const k = n.trim(); cnt[k] = (cnt[k] || 0) + 1; }));
  const old = JSON.stringify(known);
  known = Object.keys(cnt).filter(n => !HID.hp.includes(n.toLowerCase())).sort((a, b) => cnt[b] - cnt[a]).slice(0, 14);
  if (!match && view === 'home' && old !== JSON.stringify(known) && document.activeElement.tagName !== 'INPUT') render();
}
function chips() {
  if (!known.length) return '';
  const sel = names.map(x => x.trim().toLowerCase());
  return `<div class="mute sm">Spieler antippen:</div><div class="chips">${known.map((n, i) => `<button class="chip ${sel.includes(n.toLowerCase()) ? 'on' : ''}" onclick="pick(${i})">${esc(n)}</button>`).join('')}</div>`;
}
function pick(i) {
  const n = known[i], j = names.findIndex(x => x.trim().toLowerCase() === n.toLowerCase());
  if (j >= 0) names[j] = '';
  else {
    const e = names.findIndex(x => !x.trim());
    if (e >= 0) names[e] = n; else if (names.length < 4) { names.push(n); outs.push('double'); } else return toast('Maximal 4 Spieler');
  }
  render();
}
function recompute() { VIS = ROWS.filter(r => r.state.cfg && !HID.hm.includes(r.id)); SC = agg(VIS); }
function nav(v) { view = v; render(); scrollTo(0, 0); }
async function showStats() {
  const [r] = await Promise.all([db.from('matches').select('id,created_at,state').eq('finished', true).order('created_at'), loadHid()]);
  if (r.error) return toast('Statistiken konnten nicht geladen werden');
  ROWS = r.data; recompute(); leave(true); edit = false; nav('stats');
}
function hidePlayer(k) {
  const n = SC.list.find(s => s.n.toLowerCase() === k).n;
  if (!HID.hp.includes(k)) HID.hp.push(k);
  if (confirm(`${n} ist jetzt im Ranking ausgeblendet.\nSollen auch alle Matches mit ${n} aus den Statistiken der anderen herausgerechnet werden?`))
    VIS.forEach(r => { if (r.state.cfg.players.some(x => x.trim().toLowerCase() === k) && !HID.hm.includes(r.id)) HID.hm.push(r.id); });
  recompute(); saveHid(); render();
}
function showPlayerAt(i) { HID.hp.splice(i, 1); recompute(); saveHid(); render(); }
function toggleMatch(id) { const i = HID.hm.indexOf(id); if (i < 0) HID.hm.push(id); else HID.hm.splice(i, 1); recompute(); saveHid(); render(); }
function openPlayer(n) { pk = n.toLowerCase(); nav('player'); }
function openDuel(a, b) { duelA = a; duelB = b; nav('duel'); }
function openHist(f) { histF = f || ''; nav('hist'); }
function backTo(v) { nav(v); }

// ---------- Ranking ----------
let sk = 'q', sd = -1;
const COLS = [
  ['n', 'Spieler', s => s.n.toLowerCase(), null],
  ['g', 'Spiele', s => s.g, s => s.g],
  ['w', 'Siege', s => s.w, s => s.w],
  ['q', 'Quote', s => s.g ? s.w / s.g : 0, s => pc0(s.w, s.g)],
  ['avg', 'Ø', s => s.dr ? s.pts / s.dr : 0, s => s.dr ? (s.pts / s.dr * 3).toFixed(1) : '–'],
  ['f9', 'First 9', s => s.f9d ? s.f9 / s.f9d : 0, s => s.f9d ? (s.f9 / s.f9d * 3).toFixed(1) : '–'],
  ['h180', '180', s => s.h180, s => s.h180],
  ['h140', '140+', s => s.h140, s => s.h140],
  ['hf', 'Hi-Finish', s => s.hf, s => s.hf || '–'],
  ['co', 'Checkout', s => s.ch ? s.co / s.ch : 0, s => pc0(s.co, s.ch)]
];
function setSort(k) { if (sk === k) sd = -sd; else { sk = k; sd = k === 'n' ? 1 : -1; } render(); }
function chart(list, total, color) {
  const lo = Math.max(1, total - 19);
  const pl = list.map(s => ({ s, pts: s.av.filter(a => a[0] >= lo) })).filter(x => x.pts.length);
  const all = pl.flatMap(x => x.pts.map(a => a[1]));
  if (all.length < 2) return '<p class="mute">Noch zu wenig Daten für den Verlauf.</p>';
  const y0 = Math.max(0, Math.floor(Math.min(...all) / 10) * 10), y1 = Math.max(y0 + 10, Math.ceil(Math.max(...all) / 10) * 10);
  const W = 360, H = 220, L = 34, R = 12, T = 12, B = 26;
  const X = g => (L + (total === lo ? 0.5 : (g - lo) / (total - lo)) * (W - L - R)).toFixed(1);
  const Y = v => (T + (y1 - v) / (y1 - y0) * (H - T - B)).toFixed(1);
  const grid = [0, 1, 2, 3, 4].map(k => { const v = y0 + k * (y1 - y0) / 4; return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${+Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--mute)">${Math.round(v)}</text>`; }).join('');
  const lines = pl.map(({ s, pts }) => { const c = color(s); return `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(a => X(a[0]) + ',' + Y(a[1])).join(' ')}"/>` + pts.map(a => `<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="3.5" fill="${c}" stroke="var(--panel)" stroke-width="1.5"/>`).join(''); }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average-Verlauf der Spieler">${grid}${lines}<text x="${L}" y="${H - 6}" font-size="10" fill="var(--mute)">älter</text><text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--mute)">neuestes Match</text></svg>`;
}
function statsView() {
  const list = SC.list.filter(s => !HID.hp.includes(s.n.toLowerCase())), g = COLS.find(c => c[0] === sk)[2];
  RK = [...list].sort((a, b) => (g(a) > g(b) ? 1 : g(a) < g(b) ? -1 : 0) * sd || (b.w / b.g - a.w / a.g));
  const avg = s => s.dr ? s.pts / s.dr * 3 : 0, mx = Math.max(1, ...list.map(avg));
  const head = COLS.map(c => `<th><button class="th ${sk === c[0] ? 'on' : ''}" onclick="setSort('${c[0]}')">${c[1]}${sk === c[0] ? (sd < 0 ? ' ▼' : ' ▲') : ''}</button></th>`).join('');
  const body = RK.map((s, i) => `<tr><td>${i + 1}</td>${COLS.map((c, j) => `<td>${j === 0 ? `<span class="dot" style="background:${colorOf(s.n)}"></span><button class="lnk" onclick="openPlayer(RK[${i}].n)">${esc(s.n)}</button>` : c[3](s)}</td>`).join('')}${edit ? `<td><button class="ghost" style="padding:2px 8px" onclick="hidePlayer(RK[${i}].n.toLowerCase())" aria-label="Spieler ausblenden">✕</button></td>` : ''}</tr>`).join('');
  const hid = edit && HID.hp.length ? `<div class="card"><h2>Ausgeblendete Spieler</h2>${HID.hp.map((k, i) => `<button class="ghost" style="margin:0 6px 6px 0" onclick="showPlayerAt(${i})">${esc(k)} zurückholen</button>`).join('')}</div>` : '';
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button><span><button class="ghost" onclick="openHist()">Verlauf</button> <button class="ghost" onclick="edit=!edit;render()">${edit ? 'Fertig' : 'Bearbeiten'}</button> <button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></span></div><h1>Ranking</h1>
  <div class="card" style="overflow-x:auto"><table><tr><th>#</th>${head}${edit ? '<th></th>' : ''}</tr>${body || '<tr><td colspan="11" class="mute">Noch keine beendeten Matches.</td></tr>'}</table></div>
  <p class="mute sm">Tippe auf einen Spieler für sein Profil, auf eine Spaltenüberschrift zum Sortieren.</p>${hid}
  <div class="card"><h2>Average-Verlauf</h2>${chart(list, SC.total, s => colorOf(s.n))}
  <div style="margin-top:10px">${[...list].sort((a, b) => avg(b) - avg(a)).map(s => `<div class="crow"><span class="nm"><span class="dot" style="background:${colorOf(s.n)}"></span>${esc(s.n)}</span><div class="bar"><i style="width:${avg(s) / mx * 100}%;background:${colorOf(s.n)}"></i></div><span>${avg(s).toFixed(1)}</span></div>`).join('')}</div>
  <p class="mute sm">Ø = Punkte pro 3 Darts. Der Verlauf zeigt die letzten 20 Matches. Gezählt werden nur beendete Matches.</p></div></div>`;
}

// ---------- Spielerprofil ----------
function profile(k) {
  const o = { n: '', g: 0, w: 0, lp: 0, lw: 0, pts: 0, dr: 0, f9: 0, f9d: 0, vis: 0, bust: 0, hi: 0, hf: 0, ch: 0, co: 0, best: 0, wld: 0, b: Array(8).fill(0), m: [0, 0, 0, 0], f: {}, att: {}, da: 0, dh: 0, h100: 0, h140: 0, h180: 0, av: [], rows: [] };
  let gi = 0;
  for (const r of VIS) {
    gi++;
    const c = r.c ??= calc(r.state.cfg, r.state.ev), i = c.P.findIndex(p => p.name.trim().toLowerCase() === k);
    if (i < 0) continue;
    const p = c.P[i]; o.n = p.name.trim(); o.g++; if (c.winner === i) o.w++; o.rows.push(r);
    o.lp += Math.max(...c.P.flatMap(q => q.v.map(v => v.leg))) + 1;
    let pts = 0, dr = 0; const seen = {}, ld = {};
    for (const v of p.v) {
      o.vis++; pts += v.sum; dr += v.d.length; ld[v.leg] = (ld[v.leg] || 0) + v.d.length;
      if (v.bust) o.bust++;
      o.hi = Math.max(o.hi, v.sum);
      o.b[v.sum === 180 ? 7 : v.sum >= 140 ? 6 : v.sum >= 100 ? 5 : v.sum >= 80 ? 4 : v.sum >= 60 ? 3 : v.sum >= 40 ? 2 : v.sum >= 20 ? 1 : 0]++;
      if (v.sum === 180) o.h180++; else if (v.sum >= 140) o.h140++; else if (v.sum >= 100) o.h100++;
      seen[v.leg] = (seen[v.leg] || 0) + 1; if (seen[v.leg] <= 3) { o.f9 += v.sum; o.f9d += v.d.length; }
      if (route(v.before, 3, p.rule)) o.ch++;
      let rem = v.before;
      v.d.forEach(([m, x], j) => {
        o.m[m]++;
        if (m) { const f = m === 2 && x === 25 ? 'Bull' : 'SDT'[m - 1] + x; o.f[f] = (o.f[f] || 0) + 1; }
        if (p.rule !== 'single' && ((rem % 2 === 0 && rem >= 2 && rem <= 40) || rem === 50)) {
          const a = o.att[rem] ??= [0, 0]; a[0]++; o.da++;
          if (v.win && j === v.d.length - 1) { a[1]++; o.dh++; }
        }
        rem -= m * x;
      });
      if (v.win) { o.co++; o.lw++; o.hf = Math.max(o.hf, v.sum); o.best = o.best ? Math.min(o.best, ld[v.leg]) : ld[v.leg]; o.wld += ld[v.leg]; }
    }
    o.pts += pts; o.dr += dr; o.av.push([gi, dr ? pts / dr * 3 : 0]);
  }
  return o;
}
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
function board(f) {
  const C = 170, ang = d => d * Math.PI / 180;
  const pt = (r, a) => (C + r * Math.sin(ang(a))).toFixed(1) + ' ' + (C - r * Math.cos(ang(a))).toFixed(1);
  const arc = (r0, r1, a0, a1) => `M${pt(r1, a0)}A${r1} ${r1} 0 0 1 ${pt(r1, a1)}L${pt(r0, a1)}A${r0} ${r0} 0 0 0 ${pt(r0, a0)}Z`;
  const mx = { S: 1, D: 1, T: 1 };
  Object.entries(f).forEach(([k, v]) => { const t = k[0]; if (mx[t] !== undefined) mx[t] = Math.max(mx[t], v); });
  const col = (k, t) => f[k] ? `rgba(242,193,78,${(0.18 + 0.82 * Math.sqrt(f[k] / (t || mx[k[0]]))).toFixed(2)})` : 'var(--bg)';
  let out = '';
  ORDER.forEach((n, i) => {
    const a0 = i * 18 - 9, a1 = a0 + 18, s = col('S' + n), d = col('D' + n), t = col('T' + n);
    const h = k => `<title>${k}: ${f[k] || 0} Treffer</title>`;
    out += `<path d="${arc(142.9, 150, a0, a1)}" fill="${d}" stroke="var(--line)">${h('D' + n)}</path><path d="${arc(94.4, 142.9, a0, a1)}" fill="${s}" stroke="var(--line)">${h('S' + n)}</path><path d="${arc(87.4, 94.4, a0, a1)}" fill="${t}" stroke="var(--line)">${h('T' + n)}</path><path d="${arc(14, 87.4, a0, a1)}" fill="${s}" stroke="var(--line)">${h('S' + n)}</path>`;
    const [lx, ly] = pt(161, i * 18).split(' ');
    out += `<text x="${lx}" y="${+ly + 4}" text-anchor="middle" font-size="12" fill="var(--mute)">${n}</text>`;
  });
  out += `<circle cx="${C}" cy="${C}" r="14" fill="${col('S25', mx.S)}" stroke="var(--line)"><title>25: ${f.S25 || 0} Treffer</title></circle><circle cx="${C}" cy="${C}" r="5.6" fill="${f.Bull ? `rgba(242,193,78,${(0.18 + 0.82 * Math.sqrt(f.Bull / Math.max(1, f.Bull, mx.D))).toFixed(2)})` : 'var(--bg)'}" stroke="var(--line)"><title>Bull: ${f.Bull || 0} Treffer</title></circle>`;
  return `<svg viewBox="0 0 340 340" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Trefferverteilung auf der Dartscheibe">${out}</svg>`;
}
function playerView() {
  const o = profile(pk), back = `<div class="top"><button class="ghost" onclick="backTo('stats')">‹ Ranking</button><button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></div>`;
  if (!o.g) return `<div class="wrap">${back}<p class="mute">Für diesen Spieler gibt es keine Daten.</p></div>`;
  const col = colorOf(o.n), tot = o.m.reduce((a, b) => a + b, 0) || 1, pr = x => Math.round(x / tot * 100);
  const kv = [['Average', o.dr ? (o.pts / o.dr * 3).toFixed(1) : '–'], ['First 9', o.f9d ? (o.f9 / o.f9d * 3).toFixed(1) : '–'], ['Ø pro Dart', o.dr ? (o.pts / o.dr).toFixed(1) : '–'],
    ['Höchste Aufnahme', o.hi], ['Höchstes Finish', o.hf || '–'], ['180er', o.h180], ['140+', o.h140], ['100+', o.h100],
    ['Checkout-Quote', o.ch ? pc0(o.co, o.ch) + ' (' + o.co + '/' + o.ch + ')' : '–'], ['Doppelquote', o.da ? pc0(o.dh, o.da) + ' (' + o.dh + '/' + o.da + ')' : '–'],
    ['Leg-Quote', pc0(o.lw, o.lp)], ['Ø Darts pro Leg-Sieg', o.lw ? (o.wld / o.lw).toFixed(1) : '–'], ['Schnellstes Leg', o.best ? o.best + ' Darts' : '–'], ['Bust-Quote', pc0(o.bust, o.vis)]];
  const lab = ['0–19', '20–39', '40–59', '60–79', '80–99', '100–139', '140–179', '180'], bm = Math.max(1, ...o.b);
  const buckets = o.b.map((n, i) => `<div class="brow"><span>${lab[i]}</span><div class="bar"><i style="width:${n / bm * 100}%;background:${col}"></i></div><span>${n} (${pc0(n, o.vis)})</span></div>`).join('');
  const top = Object.entries(o.f).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `${k === 'S25' ? '25' : k} (${v})`).join(', ');
  const dbl = Object.entries(o.att).sort((a, b) => b[1][0] - a[1][0]).slice(0, 4).map(([r, [a, h]]) => `<div class="brow"><span>${r == 50 ? 'Bull' : 'D' + r / 2}</span><div class="bar"><i style="width:${h / a * 100}%;background:${col}"></i></div><span>${h}/${a}</span></div>`).join('');
  const opps = [...new Set(o.rows.flatMap(r => r.state.cfg.players.map(x => x.trim()).filter(x => x.toLowerCase() !== pk)))].map(n => ({ n, d: duel(pk, n.toLowerCase()) })).sort((a, b) => b.d.rows.length - a.d.rows.length);
  const duels = opps.map(({ n, d }) => `<tr><td><button class="lnk" onclick="openDuel('${pk.replace(/'/g, "\\'")}', '${n.toLowerCase().replace(/'/g, "\\'")}')">${esc(n)}</button></td><td>${d.rows.length}</td><td>${d.A ? d.A.w : 0} : ${d.B ? d.B.w : 0}</td><td>${d.A && d.A.dr ? (d.A.pts / d.A.dr * 3).toFixed(1) : '–'} : ${d.B && d.B.dr ? (d.B.pts / d.B.dr * 3).toFixed(1) : '–'}</td></tr>`).join('');
  return `<div class="wrap">${back}<h1><span class="dot" style="background:${col}"></span>${esc(o.n)}</h1>
  <p class="mute">${o.g} ${o.g === 1 ? 'Spiel' : 'Spiele'}, ${o.w} ${o.w === 1 ? 'Sieg' : 'Siege'} (${pc0(o.w, o.g)})</p>
  <div class="card"><h2>Kennzahlen</h2><div class="kv">${kv.map(([l, v]) => `<div><span class="mute sm">${l}</span><b>${v}</b></div>`).join('')}</div></div>
  <div class="card"><h2>Wurfprofil</h2>
  <div class="stack" role="img" aria-label="Verteilung der Darts"><i style="width:${pr(o.m[0])}%;background:#4a6366"></i><i style="width:${pr(o.m[1])}%;background:var(--chalk)"></i><i style="width:${pr(o.m[2])}%;background:var(--red)"></i><i style="width:${pr(o.m[3])}%;background:var(--green)"></i></div>
  <p class="mute sm">Daneben ${pr(o.m[0])}%, Single ${pr(o.m[1])}%, Double ${pr(o.m[2])}%, Triple ${pr(o.m[3])}%</p>
  ${board(o.f)}<p class="mute sm">Je heller ein Feld, desto öfter getroffen. Single, Double und Triple sind getrennt skaliert. Beim Single zählt die Eingabe nicht, ob innen oder außen.</p>
  <p><b>Meistgetroffen:</b> ${top || '–'}</p></div>
  <div class="card"><h2>Aufnahmen</h2>${buckets}<p class="mute sm">Summe pro Aufnahme (3 Darts). Bust zählt als 0.</p></div>
  <div class="card"><h2>Doppel</h2>${dbl || '<p class="mute">Noch keine Doppelversuche.</p>'}<p class="mute sm">Gezählt werden Darts, wenn der Rest ein Doppel (2 bis 40 oder Bull) war. Treffer = Checkout.</p></div>
  <div class="card"><h2>Average-Verlauf</h2>${chart([{ n: o.n, av: o.av }], VIS.length, () => col)}</div>
  <div class="card" style="overflow-x:auto"><h2>Duelle</h2><table><tr><th>Gegner</th><th>Spiele</th><th>Siege</th><th>Ø</th></tr>${duels || '<tr><td colspan="4" class="mute">Noch keine Duelle.</td></tr>'}</table><p class="mute sm">Siege und Average: du zuerst, dann der Gegner.</p></div>
  <div class="card"><h2>Letzte Matches</h2>${[...o.rows].reverse().slice(0, 5).map(matchRow).join('')}<button class="ghost" style="width:100%;margin-top:8px" onclick="openHist(pk)">Alle Matches</button></div></div>`;
}

// ---------- Duelle und Verlauf ----------
function duel(a, b) {
  const rows = VIS.filter(r => { const ks = r.state.cfg.players.map(x => x.trim().toLowerCase()); return ks.includes(a) && ks.includes(b); });
  const L = agg(rows).list;
  return { rows, A: L.find(s => s.n.toLowerCase() === a), B: L.find(s => s.n.toLowerCase() === b) };
}
function matchRow(r, ed) {
  const c = r.c ??= calc(r.state.cfg, r.state.ev), hid = HID.hm.includes(r.id);
  const sc = r.state.cfg.sets > 1 ? c.P.map(p => p.sets).join(' : ') : c.P.map(p => p.v.filter(v => v.win).length).join(' : ');
  return `<div class="hrow" style="${hid ? 'opacity:.5' : ''}" onclick="openMatch('${r.id}')"><div><b>${esc(c.winner !== null ? c.P[c.winner].name : '–')}</b> gewinnt, ${sc}<div class="mute sm">${c.P.map(p => esc(p.name)).join(' gegen ')}</div></div>
  <div class="mute sm" style="text-align:right">${dt(r.created_at)}${ed ? `<br><button class="ghost" style="padding:2px 8px;margin-top:4px" onclick="event.stopPropagation();toggleMatch('${r.id}')">${hid ? 'zurückholen' : 'ausblenden'}</button>` : ''}</div></div>`;
}
function histView() {
  const rows = ROWS.filter(r => r.state.cfg && (edit || !HID.hm.includes(r.id)) && (!histF || r.state.cfg.players.some(x => x.trim().toLowerCase() === histF))).reverse();
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="backTo('${histF ? 'player' : 'stats'}')">‹ Zurück</button><span><button class="ghost" onclick="edit=!edit;render()">${edit ? 'Fertig' : 'Bearbeiten'}</button> <button class="ghost" onclick="toggleSet()" aria-label="Einstellungen">⚙</button></span></div>
  <h1>Verlauf</h1><p class="mute">${histF ? 'Matches von ' + esc(histF) + '. ' : ''}Tippe auf ein Match für Ergebnis, Statistik und alle Würfe.</p>
  <div class="card">${rows.map(r => matchRow(r, edit)).join('') || '<p class="mute">Keine Matches.</p>'}</div></div>`;
}
function duelView() {

    const t = tile(peer, 'Mitspieler'), v = t.querySelector('video');
    v.srcObject = e.streams[0] || new MediaStream([e.track]);
    t.hidden = true; updBox();
    e.track.onunmute = () => { t.hidden = false; updBox(); v.play().catch(() => {}); };
    e.track.onmute = () => { t.hidden = true; updBox(); };
  };

    if (pc.connectionState === 'failed') toast('Kamera-Verbindung fehlgeschlagen (anderes Netz?)');
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) { const t = document.getElementById('t-' + peer); if (t) { t.hidden = true; updBox(); } }
  };

}
async function setRemote(pc, sdp) {
  await pc.setRemoteDescription(sdp);
  (pc.q || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); pc.q = [];
}
function camJoin(id) {
  camCh = db.channel('cam' + id);
  camCh.on('broadcast', { event: 'sig' }, async ({ payload: m }) => {
    if (m.from === myId || (m.to && m.to !== myId)) return;
    await iceReady;
    if (m.t === 'hello') {
      // Der mit der kleineren ID schickt das Angebot, so gibt es keinen Konflikt
      if (myId > m.from) return sig({ t: 'hello', to: m.from });
      const pc = mkPc(m.from), tr = pc.addTransceiver('video', { direction: 'sendrecv' });
      if (vt()) await tr.sender.replaceTrack(vt());
      await pc.setLocalDescription(await pc.createOffer());
      sig({ t: 'offer', to: m.from, sdp: desc(pc.localDescription) });
    } else if (m.t === 'offer') {
      const pc = mkPc(m.from); await setRemote(pc, m.sdp);
      const tr = pc.getTransceivers()[0]; tr.direction = 'sendrecv';
      if (vt()) await tr.sender.replaceTrack(vt());
      await pc.setLocalDescription(await pc.createAnswer());
      sig({ t: 'answer', to: m.from, sdp: desc(pc.localDescription) });
    } else if (m.t === 'answer' && pcs[m.from]) await setRemote(pcs[m.from], m.sdp);
    else if (m.t === 'ice' && pcs[m.from]) {
      const pc = pcs[m.from];
      if (pc.remoteDescription) pc.addIceCandidate(m.c).catch(() => {}); else (pc.q ??= []).push(m.c);
    } else if (m.t === 'off') { pcs[m.from]?.close(); dropTile(m.from); }
    else if (m.t === 'camoff') { const t = document.getElementById('t-' + m.from); if (t) { t.hidden = true; updBox(); } }
  }).subscribe(s => { if (s === 'SUBSCRIBED') sig({ t: 'hello' }); });
}
function camLeave() {
  sig({ t: 'off' });
  killCam();
  Object.values(pcs).forEach(p => p.close()); pcs = {};
  const ch = camCh; camCh = null;
  if (ch) setTimeout(() => db.removeChannel(ch), 400);
  $('#camBox').innerHTML = ''; $('#camBox').hidden = true;
}
function killCam() {
  clearInterval(camTimer);
  [stream, raw].forEach(x => x && x.getTracks().forEach(t => t.stop()));
  stream = raw = null; Z = 1; panX = panY = .5;
}
function setZoom(z) {
  Z = z;
  if (zoomHW && raw) raw.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
}
// Digitaler Zoom für Geräte ohne Kamera-Zoom (z. B. iPhone, PC): Ausschnitt wird auf eine Leinwand gezeichnet und gesendet
function digital(r) {
  const tr = r.getVideoTracks()[0], st = tr.getSettings();
  const src = document.createElement('video'); src.muted = true; src.playsInline = true; src.srcObject = r; src.play().catch(() => {});
  const cv = document.createElement('canvas'); cv.width = st.width || 1280; cv.height = st.height || 720;
  const ctx = cv.getContext('2d');
  camTimer = setInterval(() => {
    if (!src.videoWidth) return;
    const sw = cv.width / Z, sh = cv.height / Z;
    ctx.drawImage(src, (cv.width - sw) * panX, (cv.height - sh) * panY, sw, sh, 0, 0, cv.width, cv.height);
  }, 33);
  return cv.captureStream(30);
}
async function toggleCam() {
  if (stream) {
    killCam();
    Object.values(pcs).forEach(pc => pc.getSenders().forEach(x => x.replaceTrack(null).catch(() => {})));
    sig({ t: 'camoff' }); dropTile('me'); return render();
  }
  try { raw = await navigator.mediaDevices.getUserMedia({ video: { facingMode: S.cam, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }
  catch (e) { return toast('Kamera nicht erlaubt'); }
  const cap = raw.getVideoTracks()[0].getCapabilities ? raw.getVideoTracks()[0].getCapabilities() : {};
  zoomHW = cap.zoom || null; Z = 1; panX = panY = .5;
  stream = zoomHW ? raw : digital(raw);
  const t = tile('me', 'Du'); t.querySelector('video').srcObject = stream; t.hidden = false; updBox();
  sig({ t: 'hello' }); render();
}

render();
loadKnown();
