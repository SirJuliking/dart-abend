<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dart-Abend</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#14282A;--panel:#1C3538;--line:#2C4A4D;--chalk:#F1EFE8;--mute:#8FA8A4;--red:#E4483D;--green:#3DAA74}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.4 Karla,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
h1{font-size:2.6rem}h2{font-size:1.2rem;margin-bottom:10px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:inherit;padding:12px;margin-bottom:8px}
button{font:inherit;color:var(--chalk);cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}
button:focus-visible,.in:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.main{width:100%;background:var(--green);border-color:var(--green);color:#0c1d1a;font-weight:700;margin-top:6px}
.ghost{background:none}
.seg{display:flex;gap:8px;margin:8px 0}.seg>*{flex:1}
.seg .on{background:var(--chalk);color:var(--bg);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.top button{padding:8px 10px}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;min-width:0}
.col.act{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.col.won{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1.1;margin:4px 0}
.sm{font-size:.85rem}
.last{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;min-height:1.4em}
.last span{background:var(--bg);border-radius:6px;padding:0 6px}
.last .bust{color:var(--red)}
.hint{text-align:center;min-height:1.6em;margin:12px 0 4px;color:var(--mute)}.hint b{color:var(--chalk)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.r4{grid-template-columns:repeat(4,1fr)}
.nums button{font-family:Oswald,sans-serif;font-size:1.3rem;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{color:var(--mute);font-weight:400;font-size:.8rem}
.win{text-align:center}
.crow{display:grid;grid-template-columns:70px 1fr 120px;gap:8px;align-items:center;margin:8px 0}
.bar{background:var(--bg);border-radius:6px;height:22px}.bar i{display:block;height:100%;background:var(--green);border-radius:6px;min-width:2px}
#camBox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:560px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{position:relative}.tile.big{grid-column:1/-1}
.tile span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:0 8px;border-radius:6px;font-size:.8rem}
.tile video{width:100%;height:15vh;object-fit:cover;border-radius:14px;background:#000;display:block;cursor:pointer}
.tile.me video{touch-action:none}
.tile.big video{height:42vh}
.tile input{position:absolute;right:8px;bottom:6px;width:48%}
@media (min-width:900px){.tile video{height:26vh}.tile.big video{height:50vh}}
.prow{display:flex;gap:8px}.prow input{flex:3;min-width:0}.prow select{flex:2;min-width:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
</style>
</head>
<body>
<div id="camBox" hidden></div>
<div id="app"></div>
<script>
const db = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let names = ['', ''], outs = ['double', 'double'], watch = false, psec = '', showPc = false, shareOpen = false, start = 501, legsW = 3, setsW = 1, match = null, channel = null, mult = 1;

// ---------- Checkout-Weg (Double-Out) ----------
const D = [];
for (let i = 1; i <= 20; i++) D.push({l:'S'+i,v:i,d:0},{l:'D'+i,v:2*i,d:1},{l:'T'+i,v:3*i,d:0});
D.push({l:'25',v:25,d:0},{l:'Bull',v:50,d:1});
D.sort((a,b) => b.v - a.v);
const FIN = D.filter(x => x.d);
function route(r, max = 3, rule = 'double') {
  const single = rule === 'single';
  if (r > (single ? 180 : 170) || r < (single ? 1 : 2)) return null;
  const F = single ? D : rule === 'master' ? D.filter(x => x.d || x.l[0] === 'T') : FIN;
  for (const f of F) if (f.v === r) return [f.l];
  if (max >= 2) for (const a of D) for (const f of F) if (a.v + f.v === r) return [a.l, f.l];
  if (max >= 3) for (const a of D) for (const b of D) for (const f of F) if (a.v + b.v + f.v === r) return [a.l, b.l, f.l];
  return null;
}
const RL = { single: 'Single Out', double: 'Double Out', master: 'Master Out' };
const lbl = ([m, x]) => !m ? '0' : (m === 2 && x === 25 ? 'Bull' : (m === 1 ? '' : m === 2 ? 'D' : 'T') + x);

// ---------- Spiellogik: Zustand wird aus der Wurfliste berechnet ----------
function calc(cfg, ev) {
  const n = cfg.players.length;
  const P = cfg.players.map((name, i) => ({ name, rule: (cfg.outs || [])[i] || 'double', rem: cfg.start, legs: 0, sets: 0, v: [] }));
  let leg = 0, starter = 0, turn = 0, cur = null, winner = null;
  for (const [m, x] of ev) {
    if (winner !== null) break;
    const p = P[turn];
    if (!cur) cur = { before: p.rem, d: [], sum: 0, leg };
    cur.d.push([m, x]); cur.sum += m * x;
    const after = cur.before - cur.sum;
    const okFin = p.rule === 'single' || (p.rule === 'master' ? m >= 2 : m === 2);
    if (after < 0 || (after === 1 && p.rule !== 'single') || (after === 0 && !okFin)) {
      cur.bust = true; cur.sum = 0; p.rem = cur.before; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else if (after === 0) {
      cur.win = true; p.v.push(cur); cur = null; p.legs++;
      if (p.legs >= cfg.legs) { p.sets++; P.forEach(q => q.legs = 0); if (p.sets >= cfg.sets) winner = turn; }
      if (winner === null) { leg++; P.forEach(q => q.rem = cfg.start); starter = (starter + 1) % n; turn = starter; } else p.rem = 0;
    } else if (cur.d.length === 3) {
      p.rem = after; p.v.push(cur); cur = null; turn = (turn + 1) % n;
    } else p.rem = after;
  }
  return { P, turn, cur, winner };
}
const nVis = c => c.P.reduce((a, p) => a + p.v.length, 0);

// ---------- Ansichten ----------
function home() {
  const opt = (arr, cur, f) => arr.map(n => `<option value="${n}" ${cur === n ? 'selected' : ''}>${f(n)}</option>`).join('');
  return `<div class="wrap"><h1>Dart-Abend</h1><p class="mute">Spielstand live auf allen Geräten.</p>
  <div class="card"><h2>Neues Match</h2>
  ${names.map((n, i) => `<div class="prow"><input class="in" placeholder="Spieler ${i+1}" value="${esc(n)}" onchange="names[${i}]=this.value"><select class="in" aria-label="Check-out-Regel" onchange="outs[${i}]=this.value">${[['double','Double Out'],['master','Master Out'],['single','Single Out']].map(([v, l]) => `<option value="${v}" ${outs[i] === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}
  ${names.length < 4 ? '<button class="ghost" onclick="addP()">Spieler hinzufügen</button>' : ''}
  <div class="seg"><button class="${start===501?'on':''}" onclick="start=501;render()">501</button><button class="${start===301?'on':''}" onclick="start=301;render()">301</button></div>
  <div class="seg"><select class="in" onchange="legsW=+this.value">${opt([1,2,3,4,5], legsW, n => n + (n > 1 ? ' Legs' : ' Leg') + ' pro Satz')}</select>
  <select class="in" onchange="setsW=+this.value">${opt([1,2,3,4,5], setsW, n => n + (n > 1 ? ' Sätze' : ' Satz') + ' zum Sieg')}</select></div>
  <button class="main" onclick="create()">Match starten</button></div>
  <div class="card"><h2>Match beitreten</h2>
  <input class="in" id="code" placeholder="Code oder Spielercode" maxlength="14" autocapitalize="characters" style="text-transform:uppercase">
  <p class="mute sm" style="margin:0 0 8px">Mit dem normalen Code schaust du zu. Mit dem Spielercode kannst du mitspielen und eintragen.</p>
  <button class="main" onclick="joinCode()">Beitreten</button></div>
  <button class="ghost" onclick="showStats()">Ranking und Statistiken</button></div>`;
}

function col(p, i, c) {
  const act = c.turn === i && c.winner === null;
  const pts = p.v.reduce((a, v) => a + v.sum, 0), dr = p.v.reduce((a, v) => a + v.d.length, 0);
  const shown = act && c.cur ? c.cur.d.map(lbl) : (p.v.length ? p.v.at(-1).d.map(lbl) : []);
  const bust = !act && p.v.length && p.v.at(-1).bust;
  return `<div class="col ${act ? 'act' : ''} ${c.winner === i ? 'won' : ''}">
  <div class="nm">${esc(p.name)}</div><div class="mute sm">${RL[p.rule]}</div><div class="num big">${p.rem}</div>
  <div class="mute sm">Sätze ${p.sets} / Legs ${p.legs}</div><div class="mute sm">Ø ${dr ? (pts / dr * 3).toFixed(1) : '–'}</div>
  <div class="last">${shown.map(x => `<span class="${bust ? 'bust' : ''}">${x}</span>`).join('')}</div></div>`;
}

function pad() {
  return `<div class="seg">${[['Single',1],['Double',2],['Triple',3]].map(([l, m]) => `<button class="${mult === m ? 'on' : ''}" onclick="mult=${m};render()">${l}</button>`).join('')}</div>
  <div class="nums">${Array.from({length:20}, (_, i) => `<button onclick="dart(${i+1})">${i+1}</button>`).join('')}</div>
  <div class="nums r4"><button onclick="dart(25)">25</button><button onclick="dart('B')">Bull</button><button onclick="dart(0)">Daneben</button><button onclick="undo()" aria-label="Letzten Dart zurücknehmen">↶</button></div>`;
}

function matchView() {
  const st = match.st, c = calc(st.cfg, st.ev), cp = c.P[c.turn];
  const left = 3 - (c.cur ? c.cur.d.length : 0);
  const hint = !watch && c.winner === null ? route(cp.rem, left, cp.rule) : null;
  const w = c.winner !== null ? `<div class="card win"><h2>${esc(c.P[c.winner].name)} gewinnt</h2>${watch ? '' : `<button class="main" onclick="rematch()">Revanche</button>
    <button class="ghost" style="margin-top:8px" onclick="undo()">Letzten Dart korrigieren</button>`}</div>` : '';
  const sh = shareOpen && !watch ? `<div class="seg"><button onclick="share(false)">Link zum Mitspielen</button><button onclick="share(true)">Link für Zuschauer</button></div>` : '';
  const pc = watch ? '' : `<div style="margin:0 0 8px"><button class="ghost" style="padding:6px 10px;font-size:.85rem" onclick="showPc=!showPc;render()">${showPc ? 'Spielercode verbergen' : 'Spielercode anzeigen'}</button></div>`
    + (showPc ? `<div class="card win" style="margin:0 0 10px"><div class="mute sm">Spielercode (nur für Mitspieler)</div><div class="num" style="font-size:1.8rem">${esc(match.id + '-' + psec)}</div><button class="ghost" onclick="copyPc()">Kopieren</button></div>` : '');
  const bottom = c.winner !== null ? w : watch ? `<div class="hint">Am Wurf: <b>${esc(cp.name)}</b></div>`
    : `<div class="hint">${hint ? 'Checkout: <b>' + hint.join(', ') + '</b>' : '&nbsp;'}</div>${pad()}`;
  return `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button>
  <span class="mute">Zuschauer-Code <b style="color:var(--chalk)">${match.id}</b></span>
  <span>${watch ? '' : `<button class="ghost" onclick="toggleCam()">${stream ? 'Kamera aus' : 'Kamera'}</button> `}<button class="ghost" onclick="toggleVoice()" aria-label="Ansage an oder aus">${voiceOn ? '🔊' : '🔇'}</button> <button class="ghost" onclick="${watch ? 'share(true)' : 'shareOpen=!shareOpen;render()'}">Teilen</button></span></div>${sh}${pc}
  <div class="board" style="--n:${c.P.length}">${c.P.map((p, i) => col(p, i, c)).join('')}</div>
  ${bottom}</div>`;
}

// ---------- Statistiken ----------
function agg(rows) {
  const S = {};
  for (const r of rows) {
    if (!r.state.cfg) continue;
    const c = calc(r.state.cfg, r.state.ev);
    c.P.forEach((p, i) => {
      const k = p.name.trim().toLowerCase();
      const s = S[k] ??= { n: p.name.trim(), g: 0, w: 0, pts: 0, dr: 0, f9: 0, f9d: 0, h180: 0, h140: 0, hf: 0, ch: 0, co: 0, av: [] };
      s.g++; if (c.winner === i) s.w++;
      let pts = 0, dr = 0; const seen = {};
      for (const v of p.v) {
        pts += v.sum; dr += v.d.length;
        if (v.sum === 180) s.h180++; else if (v.sum >= 140) s.h140++;
        seen[v.leg] = (seen[v.leg] || 0) + 1;
        if (seen[v.leg] <= 3) { s.f9 += v.sum; s.f9d += v.d.length; }
        if (route(v.before, 3, p.rule)) { s.ch++; if (v.win) { s.co++; s.hf = Math.max(s.hf, v.sum); } }
      }
      s.pts += pts; s.dr += dr; s.av.push(dr ? pts / dr * 3 : 0);
    });
  }
  return Object.values(S);
}
const spark = a => {
  a = a.slice(-10); if (a.length < 2) return '';
  const w = 120, h = 30, mx = Math.max(...a), mn = Math.min(...a), r = (mx - mn) || 1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--chalk)" stroke-width="2" points="${a.map((v, i) => (i * w / (a.length - 1)).toFixed(1) + ',' + (h - 2 - (v - mn) / r * (h - 4)).toFixed(1)).join(' ')}"/></svg>`;
};

async function showStats() {
  const { data, error } = await db.from('matches').select('state').eq('finished', true).order('created_at');
  if (error) return toast('Statistiken konnten nicht geladen werden');
  const rows = agg(data).sort((a, b) => b.w / b.g - a.w / a.g || b.pts / b.dr - a.pts / a.dr);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
  const avg = s => s.dr ? s.pts / s.dr * 3 : 0, mx = Math.max(1, ...rows.map(avg));
  leave(true);
  $('#app').innerHTML = `<div class="wrap"><div class="top"><button class="ghost" onclick="leave()">‹ Zurück</button></div><h1>Ranking</h1>
  <div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Quote</th><th>Ø</th><th>First 9</th><th>180</th><th>140+</th><th>Hi-Finish</th><th>Checkout</th></tr>
  ${rows.map((s, i) => `<tr><td>${i+1}</td><td>${esc(s.n)}</td><td>${s.g}</td><td>${s.w}</td><td>${pct(s.w, s.g)}</td><td>${avg(s).toFixed(1)}</td><td>${s.f9d ? (s.f9 / s.f9d * 3).toFixed(1) : '–'}</td><td>${s.h180}</td><td>${s.h140}</td><td>${s.hf || '–'}</td><td>${pct(s.co, s.ch)}</td></tr>`).join('') || '<tr><td colspan="11" class="mute">Noch keine beendeten Matches.</td></tr>'}</table></div>
  <div class="card"><h2>Average und Verlauf</h2>
  ${rows.map(s => `<div class="crow"><span class="nm">${esc(s.n)}</span><div class="bar"><i style="width:${avg(s) / mx * 100}%"></i></div><span>${avg(s).toFixed(1)} ${spark(s.av)}</span></div>`).join('')}
  <p class="mute sm">Ø = Punkte pro 3 Darts. Die Linie zeigt den Average der letzten 10 Matches. Gezählt werden nur beendete Matches.</p></div></div>`;
}

function render() { if (match) hear(); $('#app').innerHTML = match ? matchView() : home(); }
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
}

// ---------- Aktionen ----------
function addP() { names.push(''); outs.push('double'); render(); }
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
function code(n = 5) {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length: n}, () => c[Math.random() * c.length | 0]).join('');
}
async function create(list = names, cfg0 = { start, legs: legsW, sets: setsW }, ol = outs) {
  const ps = [], os = [];
  list.forEach((n, i) => { if (n.trim()) { ps.push(n.trim()); os.push(ol[i] || 'double'); } });
  if (ps.length < 2) return toast('Mindestens zwei Spieler eintragen');
  const id = code(), sec = code(8);
  const { error } = await db.from('matches').insert({ id, state: { cfg: { ...cfg0, players: ps, outs: os }, ev: [], ph: await sha(sec) } });
  if (error) return toast('Match konnte nicht erstellt werden');
  openMatch(id, sec);
}
async function openMatch(id, sec = null) {
  const { data, error } = await db.from('matches').select('state').eq('id', id).maybeSingle();
  if (error || !data) return toast('Match nicht gefunden');
  if (!data.state.cfg) return toast('Dieses Match stammt aus der alten Version');
  if (sec && data.state.ph && await sha(sec) !== data.state.ph) return toast('Spielercode stimmt nicht');
  leave(true);
  match = { id, st: data.state }; heard = data.state.ev.length; mult = 1; watch = !sec; psec = sec || ''; shareOpen = false; showPc = false;
  history.replaceState(null, '', '?m=' + id + (sec ? '&p=' + sec : ''));
  channel = db.channel('m' + id).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'matches', filter: 'id=eq.' + id },
    p => { match.st = p.new.state; render(); }).subscribe();
  camJoin(id); render();
}
function joinCode() {
  const [id, sec] = $('#code').value.trim().toUpperCase().replace(/\s/g, '').split('-');
  if (!id) return toast('Bitte einen Code eingeben');
  openMatch(id, sec || null);
}
function leave(keep) {
  if (channel) db.removeChannel(channel);
  channel = null; match = null; camLeave();
  if (!keep) { history.replaceState(null, '', location.pathname); render(); }
}
async function save() {
  const { error } = await db.from('matches').update({ state: match.st, finished: calc(match.st.cfg, match.st.ev).winner !== null, updated_at: new Date().toISOString() }).eq('id', match.id);
  if (error) toast('Speichern fehlgeschlagen');
}
function dart(x) {
  if (watch) return;
  const st = match.st, c = calc(st.cfg, st.ev);
  if (c.winner !== null) return;
  let e;
  if (x === 0) e = [0, 0];
  else if (x === 'B') e = [2, 25];
  else if (x === 25) { if (mult === 3) return toast('Triple 25 gibt es nicht'); e = [mult === 2 ? 2 : 1, 25]; }
  else e = [mult, x];
  st.ev.push(e); mult = 1;
  const c2 = calc(st.cfg, st.ev), v = nVis(c2) > nVis(c) ? c2.P[c.turn].v.at(-1) : null;
  if (v && v.bust) toast('Bust'); else if (v && v.win) toast(c2.winner !== null ? 'Match gewonnen' : 'Leg gewonnen');
  render(); save();
}
function undo() {
  if (watch) return;
  if (!match.st.ev.length) return toast('Nichts zum Zurücknehmen');
  match.st.ev.pop(); render(); save();
}
function rematch() {
  const cfg = match.st.cfg, ps = [...cfg.players], os = cfg.outs ? [...cfg.outs] : ps.map(() => 'double');
  ps.push(ps.shift()); os.push(os.shift());
  create(ps, { start: cfg.start, legs: cfg.legs, sets: cfg.sets }, os);
}
async function share(w) {
  const url = location.origin + location.pathname + '?m=' + match.id + (w || watch ? '' : '&p=' + psec);
  shareOpen = false; render();
  if (navigator.share) { try { await navigator.share({ title: 'Dart-Abend', url }); return; } catch (e) {} }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert'); } catch (e) { toast(url); }
}

function copyPc() {
  const t = match.id + '-' + psec;
  navigator.clipboard.writeText(t).then(() => toast('Spielercode kopiert'), () => toast(t));
}

// ---------- Ansage: echte Aufnahmen (sprache.wav + sprache.json), sonst Stimme des Geräts ----------
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let heard = 0, voiceOn = lsGet('dv') !== '0', ac = null, pack = null, packTried = false, playing = [];
const dl = l => l === 'Bull' ? 'Bull' : l === '25' ? 'fünfundzwanzig' : ({ S: 'Single ', D: 'Doppel ', T: 'Triple ' })[l[0]] + l.slice(1);
const ck = l => l === 'Bull' ? ['bull'] : l === '25' ? ['n25'] : [{ S: 'single', D: 'doppel', T: 'triple' }[l[0]], 'n' + l.slice(1)];
function phrases(cfg, ev, h) {
  const out = [], say = (t, k) => out.push({ t, k });
  if (ev.length <= h) return out;
  const before = calc(cfg, ev.slice(0, -1)), after = calc(cfg, ev);
  const t = before.turn, bp = before.P[t], ap = after.P[t], pk = 'p' + (t + 1);
  if (ap.v.length > bp.v.length) {
    const v = ap.v.at(-1);
    if (v.win) {
      if (after.winner !== null) say(`Spiel, Satz und Match, ${ap.name}`, ['match', pk]);
      else if (ap.sets > bp.sets) say(`Satz für ${ap.name}`, ['satz_fuer', pk]);
      else say(`Leg für ${ap.name}`, ['leg_fuer', pk]);
    } else if (v.sum === 180) say('Einhundertachtzig!', ['n180']);
    else if (v.sum >= 100) say(String(v.sum), ['n' + v.sum]);
  }
  if (after.winner === null && !after.cur) {
    const q = after.P[after.turn], r = route(q.rem, 3, q.rule);
    if (r) say(`${q.name}, ${q.rem} Rest: ${r.map(dl).join(', ')}`, ['p' + (after.turn + 1), ...r.flatMap(ck)]);
  }
  return out;
}
async function loadPack() {
  if (packTried) return; packTried = true;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const [j, w] = await Promise.all([fetch('sprache.json'), fetch('sprache.wav')]);
    if (!j.ok || !w.ok) return;
    const idx = await j.json();
    pack = { idx, buf: await ac.decodeAudioData(await w.arrayBuffer()) };
  } catch (e) {}
}
function stopAll() {
  playing.forEach(x => { try { x.stop(); } catch (e) {} }); playing = [];
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function speak(list) {
  stopAll();
  if (pack && list.every(x => x.k && x.k.every(c => pack.idx[c]))) {
    if (ac.state === 'suspended') ac.resume();
    let at = ac.currentTime + 0.05;
    list.forEach(x => {
      x.k.forEach(c => {
        const g = pack.idx[c], src = ac.createBufferSource();
        src.buffer = pack.buf; src.connect(ac.destination); src.start(at, g.s, g.e - g.s);
        playing.push(src); at += g.e - g.s + 0.04;
      });
      at += 0.25;
    });
    return;
  }
  if (!window.speechSynthesis) return;
  const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('de'));
  list.forEach(x => { const u = new SpeechSynthesisUtterance(x.t); u.lang = 'de-DE'; if (v) u.voice = v; speechSynthesis.speak(u); });
}
function hear() {
  const st = match.st, n = st.ev.length;
  if (n < heard) { heard = n; return; }
  const ph = phrases(st.cfg, st.ev, heard); heard = n;
  if (voiceOn && ph.length) speak(ph);
}
function toggleVoice() {
  voiceOn = !voiceOn; lsSet('dv', voiceOn ? '1' : '0');
  if (!voiceOn) stopAll();
  toast(voiceOn ? (pack ? 'Ansage an (deine Aufnahmen)' : 'Ansage an (Gerätestimme)') : 'Ansage aus');
  render();
}
// Browser erlauben Ton erst nach der ersten Berührung
addEventListener('pointerdown', () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  loadPack();
  if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
}, { once: true });

// ---------- Kamera (WebRTC, jeder sieht jeden) ----------
let ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }, ...(CFG.TURN || [])] };
const iceReady = (async () => {
  if (!CFG.TURN_APP || !CFG.TURN_KEY) return;
  try {
    const r = await fetch(`https://${CFG.TURN_APP}.metered.live/api/v1/turn/credentials?apiKey=${CFG.TURN_KEY}`);
    if (r.ok) ICE = { iceServers: [...ICE.iceServers, ...(await r.json())] };
  } catch (e) {}
})();
const myId = Math.random().toString(36).slice(2, 8);
let stream = null, pcs = {}, camCh = null, raw = null, zoomHW = null, Z = 1, panX = .5, panY = .5, camTimer = null;
const sig = p => camCh && camCh.send({ type: 'broadcast', event: 'sig', payload: { ...p, from: myId } });
const desc = d => ({ type: d.type, sdp: d.sdp });
const vt = () => stream && stream.getVideoTracks()[0];
const updBox = () => { $('#camBox').hidden = ![...$('#camBox').children].some(t => !t.hidden); };
function tile(id, label) {
  let t = document.getElementById('t-' + id);
  if (!t) {
    t = document.createElement('div'); t.id = 't-' + id; t.className = 'tile';
    t.innerHTML = '<video autoplay playsinline muted></video><span></span>';
    $('#camBox').appendChild(t);
  }
  t.querySelector('span').textContent = label;
  if (!t._init) {
    t._init = true;
    t.onclick = e => { if (e.target.tagName === 'INPUT' || t._moved) return; t.classList.toggle('big'); };
    if (id === 'me') {
      t.classList.add('me');
      const r = document.createElement('input'); r.type = 'range'; r.setAttribute('aria-label', 'Zoom');
      r.min = zoomHW ? zoomHW.min : 1; r.max = zoomHW ? Math.min(zoomHW.max, 8) : 4; r.step = zoomHW ? (zoomHW.step || .1) : .1; r.value = r.min;
      r.oninput = () => setZoom(+r.value); t.appendChild(r);
      const v = t.querySelector('video'); let sx = 0, sy = 0, dn = false;
      v.onpointerdown = e => { dn = true; sx = e.clientX; sy = e.clientY; t._moved = false; };
      v.onpointermove = e => {
        if (!dn || zoomHW || Z <= 1) return;
        const b = v.getBoundingClientRect(), dx = (e.clientX - sx) / b.width, dy = (e.clientY - sy) / b.height;
        sx = e.clientX; sy = e.clientY; if (Math.abs(dx) + Math.abs(dy) > .002) t._moved = true;
        panX = Math.min(1, Math.max(0, panX - dx / (Z - 1))); panY = Math.min(1, Math.max(0, panY - dy / (Z - 1)));
      };
      v.onpointerup = v.onpointercancel = () => { dn = false; setTimeout(() => t._moved = false, 60); };
    }
  }
  return t;
}
function dropTile(id) { document.getElementById('t-' + id)?.remove(); updBox(); }
function mkPc(peer) {
  pcs[peer]?.close();
  const pc = new RTCPeerConnection(ICE); pcs[peer] = pc;
  pc.onicecandidate = e => e.candidate && sig({ t: 'ice', to: peer, c: e.candidate.toJSON() });
  pc.ontrack = e => {
    const t = tile(peer, 'Mitspieler'), v = t.querySelector('video');
    v.srcObject = e.streams[0] || new MediaStream([e.track]);
    t.hidden = true; updBox();
    e.track.onunmute = () => { t.hidden = false; updBox(); v.play().catch(() => {}); };
    e.track.onmute = () => { t.hidden = true; updBox(); };
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') toast('Kamera-Verbindung fehlgeschlagen (anderes Netz?)');
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) { const t = document.getElementById('t-' + peer); if (t) { t.hidden = true; updBox(); } }
  };
  return pc;
}
async function setRemote(pc, sdp) {
  await pc.setRemoteDescription(sdp);
  (pc.q || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); pc.q = [];
}
function camJoin(id) {
  camCh = db.channel('cam' + id);
  camCh.on('broadcast', { event: 'sig' }, async ({ payload: m }) => {
    if (m.from === myId || (m.to && m.to !== myId)) return;
    await iceReady;
    if (m.t === 'hello') {
      // Der mit der kleineren ID schickt das Angebot, so gibt es keinen Konflikt
      if (myId > m.from) return sig({ t: 'hello', to: m.from });
      const pc = mkPc(m.from), tr = pc.addTransceiver('video', { direction: 'sendrecv' });
      if (vt()) await tr.sender.replaceTrack(vt());
      await pc.setLocalDescription(await pc.createOffer());
      sig({ t: 'offer', to: m.from, sdp: desc(pc.localDescription) });
    } else if (m.t === 'offer') {
      const pc = mkPc(m.from); await setRemote(pc, m.sdp);
      const tr = pc.getTransceivers()[0]; tr.direction = 'sendrecv';
      if (vt()) await tr.sender.replaceTrack(vt());
      await pc.setLocalDescription(await pc.createAnswer());
      sig({ t: 'answer', to: m.from, sdp: desc(pc.localDescription) });
    } else if (m.t === 'answer' && pcs[m.from]) await setRemote(pcs[m.from], m.sdp);
    else if (m.t === 'ice' && pcs[m.from]) {
      const pc = pcs[m.from];
      if (pc.remoteDescription) pc.addIceCandidate(m.c).catch(() => {}); else (pc.q ??= []).push(m.c);
    } else if (m.t === 'off') { pcs[m.from]?.close(); dropTile(m.from); }
    else if (m.t === 'camoff') { const t = document.getElementById('t-' + m.from); if (t) { t.hidden = true; updBox(); } }
  }).subscribe(s => { if (s === 'SUBSCRIBED') sig({ t: 'hello' }); });
}
function camLeave() {
  sig({ t: 'off' });
  killCam();
  Object.values(pcs).forEach(p => p.close()); pcs = {};
  const ch = camCh; camCh = null;
  if (ch) setTimeout(() => db.removeChannel(ch), 400);
  $('#camBox').innerHTML = ''; $('#camBox').hidden = true;
}
function killCam() {
  clearInterval(camTimer);
  [stream, raw].forEach(x => x && x.getTracks().forEach(t => t.stop()));
  stream = raw = null; Z = 1; panX = panY = .5;
}
function setZoom(z) {
  Z = z;
  if (zoomHW && raw) raw.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
}
// Digitaler Zoom für Geräte ohne Kamera-Zoom (z. B. iPhone, PC): Ausschnitt wird auf eine Leinwand gezeichnet und gesendet
function digital(r) {
  const tr = r.getVideoTracks()[0], st = tr.getSettings();
  const src = document.createElement('video'); src.muted = true; src.playsInline = true; src.srcObject = r; src.play().catch(() => {});
  const cv = document.createElement('canvas'); cv.width = st.width || 1280; cv.height = st.height || 720;
  const ctx = cv.getContext('2d');
  camTimer = setInterval(() => {
    if (!src.videoWidth) return;
    const sw = cv.width / Z, sh = cv.height / Z;
    ctx.drawImage(src, (cv.width - sw) * panX, (cv.height - sh) * panY, sw, sh, 0, 0, cv.width, cv.height);
  }, 33);
  return cv.captureStream(30);
}
async function toggleCam() {
  if (stream) {
    killCam();
    Object.values(pcs).forEach(pc => pc.getSenders().forEach(x => x.replaceTrack(null).catch(() => {})));
    sig({ t: 'camoff' }); dropTile('me'); return render();
  }
  try { raw = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }
  catch (e) { return toast('Kamera nicht erlaubt'); }
  const cap = raw.getVideoTracks()[0].getCapabilities ? raw.getVideoTracks()[0].getCapabilities() : {};
  zoomHW = cap.zoom || null; Z = 1; panX = panY = .5;
  stream = zoomHW ? raw : digital(raw);
  const t = tile('me', 'Du'); t.querySelector('video').srcObject = stream; t.hidden = false; updBox();
  sig({ t: 'hello' }); render();
}

// ---------- Start ----------
render();
const q0 = new URLSearchParams(location.search), m0 = q0.get('m');
if (m0) openMatch(m0.toUpperCase(), q0.get('p'));
</script>
